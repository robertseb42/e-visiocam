<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — E-VISIOCAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="auth-api.js"></script>
    <script src="legal-banner.js"></script>
    <script src="nav-auth.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { primary: '#e91e63', hover: '#d81b60' },
                        darkpurple: '#1a0b2e'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .msg-bubble-sent { background: #e91e63; color: white; }
        .msg-bubble-received { background: #f1f5f9; color: #1e293b; }
        .conv-item { transition: all 0.15s ease; }
        .conv-item:hover { background: #f8fafc; }
        .conv-item.active { background: #fdf2f8; border-left: 3px solid #e91e63; }
        .modal-backdrop { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); }
    </style>

    <link rel="stylesheet" href="style.css?v=20261001-2">
</head>
<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<script>
(function() {
    if (typeof isLoggedIn !== 'function' || !isLoggedIn()) {
        window.location.href = 'login.html?redirect=messages.html';
    }
})();
</script>

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <!-- Même grille que l'accueil : logo dans la colonne de 256px, menu aligné sur le contenu -->
    <div class="max-w-[1700px] mx-auto px-3 md:px-6 h-16 flex items-center gap-6">
        <div class="flex items-center lg:w-64 lg:shrink-0">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white">
                    <i class="fa-solid font-bold text-lg fa-video"></i>
                </div>
                <span class="text-2xl font-black tracking-tight text-slate-900">
                    E-<span class="text-brand-primary">VISIOCAM</span>
                </span>
            </a>
        </div>
        <nav class="hidden lg:flex items-center gap-0.5 xl:gap-1 whitespace-nowrap text-sm font-medium">
            <a href="index.html" style="padding-left:0" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors">Accueil</a>
            <a href="live.html" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors">En direct</a>
            <a href="modeles.html" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors">Modèles</a>
            <a href="salons.html" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors">Salons</a>
            <a href="messages.html" class="px-2 xl:px-3 py-2 text-brand-primary border-b-2 border-brand-primary font-semibold">Messages</a>
            <a href="credits.html" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors">Crédits</a>
        </nav>
        <div class="ml-auto flex items-center gap-3 sm:gap-5">
            <div id="navAuth" class="flex items-center gap-2"></div>
        </div>
    </div>
</header>

<main class="max-w-[1700px] w-full mx-auto flex-1 p-3 md:p-6">
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-3xl font-extrabold text-slate-900 flex items-center gap-3">
            <i class="fa-solid fa-comments text-brand-primary"></i> Messages
        </h1>
        <button onclick="openNewConvModal()" class="px-4 py-2.5 bg-gradient-to-r from-brand-primary to-rose-500 text-white font-bold rounded-xl shadow-lg shadow-pink-500/25 flex items-center gap-2 hover:opacity-90 transition-all">
            <i class="fa-solid fa-plus"></i>
            <span>Nouvelle conversation</span>
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 h-[calc(100vh-240px)] min-h-[500px]">
        <!-- LISTE CONVERSATIONS -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-100">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchConv" placeholder="Rechercher une conversation..."
                        class="w-full pl-9 pr-4 py-2 bg-slate-100 text-sm rounded-xl border border-transparent focus:border-brand-primary focus:bg-white focus:outline-none transition-all">
                </div>
            </div>
            <div id="conversationsList" class="flex-1 overflow-y-auto"></div>
        </div>

        <!-- CHAT -->
        <div class="md:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
            <div id="chatHeader" class="p-4 border-b border-slate-100 flex items-center justify-between hidden">
                <div class="flex items-center gap-3">
                    <div id="chatAvatar" class="w-11 h-11 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 text-white flex items-center justify-center font-bold text-lg">?</div>
                    <div>
                        <p id="chatUsername" class="font-bold text-slate-900">—</p>
                        <p id="chatStatus" class="text-xs text-emerald-600 flex items-center gap-1">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full inline-block"></span>
                            <span>En ligne</span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="deleteCurrentConversation()" title="Supprimer" class="w-9 h-9 rounded-lg text-rose-500 hover:bg-rose-50 flex items-center justify-center transition-all">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button onclick="closeConversation()" class="w-9 h-9 rounded-lg text-slate-400 hover:bg-slate-100 flex items-center justify-center transition-all">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50">
                <div class="h-full flex items-center justify-center text-center text-slate-400">
                    <div>
                        <i class="fa-solid fa-comments text-5xl mb-3 text-slate-300"></i>
                        <p class="text-sm">Sélectionne une conversation pour commencer</p>
                    </div>
                </div>
            </div>

            <div id="chatInputWrapper" class="p-3 border-t border-slate-100 hidden">
                <div class="flex items-center gap-2">
                    <input type="text" id="messageInput" placeholder="Écrire un message..."
                        class="flex-1 px-4 py-3 bg-slate-100 rounded-2xl text-sm border border-transparent focus:border-brand-primary focus:bg-white focus:outline-none transition-all"
                        maxlength="2000">
                    <button onclick="sendMessage()" class="w-12 h-12 rounded-2xl bg-gradient-to-r from-brand-primary to-rose-500 text-white flex items-center justify-center hover:opacity-90 transition-all shadow-lg shadow-pink-500/25">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- MODAL : NOUVELLE CONVERSATION -->
<div id="newConvModal" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl overflow-hidden">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
            <h3 class="text-lg font-extrabold text-slate-900">Nouvelle conversation</h3>
            <button onclick="closeNewConvModal()" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-5">
            <div class="relative mb-4">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="userSearchInput" placeholder="Rechercher un pseudo..."
                    class="w-full pl-9 pr-4 py-3 bg-slate-100 text-sm rounded-xl border border-transparent focus:border-brand-primary focus:bg-white focus:outline-none transition-all">
            </div>
            <div id="userSearchResults" class="max-h-80 overflow-y-auto">
                <p class="text-center text-slate-400 text-sm py-6">Tape au moins 2 lettres pour chercher</p>
            </div>
        </div>
    </div>
</div>
<script src="messages.js"></script>
 <script src="radio-widget.js"></script>
<script src="radio-widget-floating.js"></script>
</body>
</html>
