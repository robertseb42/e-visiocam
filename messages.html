<header class="cam-header bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">

                    <i class="fa-solid font-bold text-lg fa-video"></i>
                </div>

            <a class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors" href="credits.html">Récompenses</a>
        </nav>
        <div class="ml-auto flex items-center gap-3 sm:gap-5">
            <div class="cam-search relative hidden sm:block w-48 md:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input aria-label="Rechercher un modèle" class="w-full pl-9 pr-4 py-2 bg-slate-100 focus:bg-white text-sm rounded-full border border-transparent focus:border-brand-primary focus:outline-none transition-all" placeholder="Rechercher un modèle..." type="text"/>
            </div>
            <button aria-label="Changer de thème" class="p-2 text-slate-600 hover:text-brand-primary rounded-full hover:bg-slate-100 transition-colors text-lg leading-none" data-theme-toggle title="Changer de thème" type="button">☀️</button>
            <button data-nav-bell aria-label="Notifications" class="relative p-2 text-slate-600 hover:text-brand-primary rounded-full hover:bg-slate-100 transition-colors">
                <i class="fa-regular fa-bell text-lg"></i>
                <span data-nav-bell-badge class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-brand-primary text-slate-900 text-[10px] font-bold items-center justify-center ring-2 ring-white">0</span>

        </div>
    </div>
</header>

<main class="evm max-w-[1700px] w-full mx-auto flex-1 p-3 md:p-6">
    <div class="evm-tete">
        <h1><i class="fa-solid fa-envelope-open-text" aria-hidden="true"></i> Ma messagerie</h1>
        <button type="button" id="evmNouveau" class="evm-btn evm-btn-ecrire"><i class="fa-solid fa-pen" aria-hidden="true"></i> Nouveau message</button>
    </div>

    <div class="evm-boite">
        <!-- Dossiers -->
        <nav class="evm-dossiers" aria-label="Dossiers">
            <button type="button" data-dossier="recus" class="actif"><i class="fa-solid fa-inbox" aria-hidden="true"></i><span>Reçus</span><b id="evmCompteRecus" hidden>0</b></button>
            <button type="button" data-dossier="envoyes"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i><span>Envoyés</span></button>
            <button type="button" data-dossier="corbeille"><i class="fa-solid fa-trash-can" aria-hidden="true"></i><span>Corbeille</span></button>
            <p class="evm-astuce"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> Vous pouvez écrire à un membre même s'il n'est pas connecté : il trouvera votre message dans ses Reçus.</p>
        </nav>

        <!-- Liste des messages -->
        <section class="evm-liste" aria-label="Messages">
            <div class="evm-recherche">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="evmRecherche" placeholder="Rechercher (pseudo, objet, texte)…" aria-label="Rechercher dans la messagerie" maxlength="60">
            </div>
            <ul id="evmListe" class="evm-lignes"></ul>
            <button type="button" id="evmPlus" class="evm-plus" hidden>Messages plus anciens</button>
        </section>

        <!-- Lecture -->
        <section class="evm-lecture" id="evmLecture" aria-live="polite">
            <div class="evm-vide"><i class="fa-regular fa-envelope" aria-hidden="true"></i><p>Sélectionnez un message pour le lire</p></div>
        </section>
    </div>
</main>

<!-- Fenêtre : nouveau message / répondre -->
<div id="evmFenetre" class="evm-fond" hidden>
    <form id="evmForm" class="evm-fenetre" role="dialog" aria-modal="true" aria-labelledby="evmFenetreTitre" novalidate>
        <div class="evm-fenetre-tete">
            <h2 id="evmFenetreTitre">Nouveau message</h2>
            <button type="button" class="evm-fermer" id="evmFermer" aria-label="Fermer"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <label class="evm-champ">
            <span>À</span>
            <div class="evm-a">
                <span id="evmAChoisi" class="evm-puce" hidden></span>
                <input type="text" id="evmA" placeholder="Pseudo du membre…" autocomplete="off" maxlength="40">
                <ul id="evmSuggestions" class="evm-suggestions" hidden></ul>
            </div>
        </label>
        <label class="evm-champ">
            <span>Objet</span>
            <input type="text" id="evmObjet" placeholder="(facultatif)" maxlength="120">
        </label>
        <label class="evm-champ evm-champ-texte">
            <span class="evm-sr">Message</span>
            <textarea id="evmTexte" rows="9" maxlength="2000" placeholder="Votre message…" required></textarea>
        </label>
        <p id="evmErreur" class="evm-erreur" role="alert" hidden></p>
        <div class="evm-fenetre-pied">
            <small id="evmCompteur">0 / 2000</small>
            <button type="submit" class="evm-btn evm-btn-ecrire" id="evmEnvoyer"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Envoyer</button>
        </div>
    </form>
</div>
