<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <title>Messages — E-VISIOCAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white"><i class="fa-solid fa-video"></i></div>
            <span class="text-2xl font-black text-slate-900">E-<span class="text-brand-primary">VISIOCAM</span></span>
        </a>
        <nav class="hidden lg:flex items-center gap-1 text-sm font-medium">
            <a href="index.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Accueil</a>
            <a href="live.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">En direct</a>
            <a href="modeles.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Modèles</a>
            <a href="salons.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Salons</a>
            <a href="messages.html" class="px-3 py-2 text-brand-primary border-b-2 border-brand-primary font-semibold">Messages</a>
            <a href="credits.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Crédits</a>
        </nav>
        <a href="compte.html" class="flex items-center gap-2 pl-2 pr-4 py-1.5 bg-slate-100 rounded-full text-sm font-semibold">
            <div class="w-7 h-7 rounded-full bg-gradient-to-r from-purple-500 to-brand-primary text-white flex items-center justify-center text-xs font-bold">3</div>
        </a>
    </div>
</header>

<main class="max-w-[1700px] w-full mx-auto flex-1 p-6">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-6">✉️ Messages</h1>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 h-[calc(100vh-200px)]">
        <!-- Conversation list -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-y-auto">
            <div class="p-4 border-b border-slate-100">
                <input type="text" placeholder="Rechercher une conversation..." class="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary">
            </div>
            <div id="conversations"></div>
        </div>

        <!-- Chat window -->
        <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm flex flex-col">
            <div class="p-4 border-b border-slate-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-brand-primary text-white flex items-center justify-center font-bold">L</div>
                <div>
                    <h3 class="font-bold text-slate-900">Luna</h3>
                    <p class="text-xs text-emerald-500"><i class="fa-solid fa-circle text-[8px]"></i> En ligne</p>
                </div>
            </div>
            <div class="flex-1 p-4 overflow-y-auto space-y-3" id="messageThread">
                <div class="flex justify-start"><div class="bg-slate-100 rounded-2xl px-4 py-2 text-sm max-w-xs">Salut ! Comment ça va ? 😊</div></div>
                <div class="flex justify-end"><div class="bg-brand-primary text-white rounded-2xl px-4 py-2 text-sm max-w-xs">Ça va très bien, merci ! Et toi ?</div></div>
                <div class="flex justify-start"><div class="bg-slate-100 rounded-2xl px-4 py-2 text-sm max-w-xs">Super ! Tu veux qu'on discute en privé ?</div></div>
            </div>
            <form onsubmit="event.preventDefault(); sendMsg();" class="p-3 border-t border-slate-100 flex gap-2">
                <input type="text" id="msgInput" placeholder="Écrire un message..." class="flex-1 px-4 py-2 bg-slate-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary">
                <button class="w-10 h-10 rounded-full bg-brand-primary hover:bg-brand-hover text-white"><i class="fa-solid fa-paper-plane text-sm"></i></button>
            </form>
        </div>
    </div>
</main>

<script>
const convos = [
    { name: "Luna", last: "Tu veux qu'on discute en privé ?", time: "20:32", unread: 2, color: "from-pink-500 to-purple-600" },
    { name: "Chloé", last: "Merci pour le cadeau ❤️", time: "19:45", unread: 0, color: "from-purple-500 to-indigo-600" },
    { name: "Mia", last: "À demain !", time: "Hier", unread: 0, color: "from-rose-500 to-pink-600" },
    { name: "Sofia", last: "Bonne soirée 😘", time: "Lun", unread: 0, color: "from-amber-500 to-purple-600" },
];

document.getElementById('conversations').innerHTML = convos.map((c, i) => `
    <div class="p-4 flex items-center gap-3 hover:bg-slate-50 cursor-pointer ${i === 0 ? 'bg-pink-50/50 border-l-4 border-brand-primary' : ''}">
        <div class="w-10 h-10 rounded-full bg-gradient-to-r ${c.color} text-white flex items-center justify-center font-bold shrink-0">${c.name[0]}</div>
        <div class="flex-1 min-w-0">
            <div class="flex justify-between"><h4 class="font-bold text-sm text-slate-900">${c.name}</h4><span class="text-[10px] text-slate-400">${c.time}</span></div>
            <p class="text-xs text-slate-500 truncate">${c.last}</p>
        </div>
        ${c.unread ? `<span class="bg-brand-primary text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shrink-0">${c.unread}</span>` : ''}
    </div>
`).join('');

function sendMsg() {
    const input = document.getElementById('msgInput');
    const msg = input.value.trim();
    if (!msg) return;
    const thread = document.getElementById('messageThread');
    const div = document.createElement('div');
    div.className = 'flex justify-end';
    div.innerHTML = `<div class="bg-brand-primary text-white rounded-2xl px-4 py-2 text-sm max-w-xs">${escapeHtml(msg)}</div>`;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
    input.value = '';
}
</script>

</body>
</html>
