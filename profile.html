<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <!-- Politique de sécurité : seules ces sources peuvent charger du code, des styles ou des données -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://api.e-visiocam.com https://cdn.socket.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.e-visiocam.com wss://api.e-visiocam.com http://localhost:3000 ws://localhost:3000; frame-src https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil — E-VISIOCAM</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#111113">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="auth-api.js"></script>
    <script src="departements-data.js"></script>
    <script src="legal-banner.js"></script>
    <script src="nav-auth.js" defer></script>

    <link rel="stylesheet" href="style.css?v=20261010-guides">
    <script src="maintenance.js" defer></script>
    <link rel="stylesheet" href="tailwind.css?v=20261009">
  <script src="persistent-radio-bootstrap.js"></script>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<script>
(function() {
    if (typeof isLoggedIn !== 'function' || !isLoggedIn()) {
        window.location.href = 'login.html?redirect=profile.html';
    }
})();
</script>

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white">
                <i class="fa-solid font-bold text-lg fa-video"></i>
            </div>
            <span class="text-2xl font-black tracking-tight text-slate-900">
                E-<span class="text-brand-primary">VISIOCAM</span>
            </span>
        </a>
        <div class="evc-actions flex items-center gap-2 sm:gap-3">
            <!-- Barre d'actions commune à toutes les pages : thème, boule à facettes, cloche, compte -->
            <button data-theme-toggle type="button" aria-label="Changer de thème" title="Changer de thème" class="p-2 text-slate-600 hover:text-brand-primary rounded-full hover:bg-slate-100 transition-colors text-lg leading-none"><i class="fa-regular fa-sun"></i></button>
            <button data-disco-toggle type="button" aria-label="Boule à facettes" class="p-2 text-slate-600 hover:text-brand-primary rounded-full hover:bg-slate-100 transition-colors"></button>
            <button data-nav-bell aria-label="Notifications" onclick="ouvrirNotifications()" class="relative p-2 text-slate-600 hover:text-brand-primary rounded-full hover:bg-slate-100 transition-colors">
                <i class="fa-regular fa-bell text-lg"></i>
                <span data-nav-bell-badge class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-brand-primary text-slate-900 text-[10px] font-bold items-center justify-center ring-2 ring-white">0</span>
            </button>
            <div id="navAuth" class="flex items-center gap-2"></div>
        </div>
    </div>
</header>

<main class="max-w-3xl w-full mx-auto flex-1 p-6">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-extrabold text-slate-900">Mon profil</h1>
        <a href="compte.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm flex items-center gap-2 transition-all">
            <i class="fa-solid fa-gear"></i> Modifier
        </a>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
        <div id="profileContent">
            <p class="text-center text-slate-400 py-8">Chargement...</p>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', async function() {
    const user = getCurrentUser();
    if (!user) return;

    const roleLabels = {
        super_admin: '👑 Super Admin',
        moderator: '🔵 Modérateur',
        model: '🟢 Modèle',
        user: '⚪ Utilisateur'
    };

    let joinedText = '';
    if (user.created_at) {
        const date = new Date(user.created_at).toLocaleDateString('fr-FR', { year: 'numeric', month: 'long' });
        joinedText = 'Membre depuis ' + date;
    }

    document.getElementById('profileContent').innerHTML = `
        <div class="flex items-center gap-5 mb-6">
            <div class="w-24 h-24 rounded-full overflow-hidden bg-gradient-to-r from-pink-500 to-purple-600 text-white flex items-center justify-center font-bold text-4xl shrink-0">
                ${(user.avatar && urlAvatar(user.avatar.url)) ? `<img src="${urlAvatar(user.avatar.url)}" alt="" style="width:100%;height:100%;object-fit:cover">` : user.username.charAt(0).toUpperCase()}
            </div>
            <div class="flex-1 min-w-0">
                <h2 class="text-2xl font-bold text-slate-900 truncate">${user.username}</h2>
                <p class="text-sm text-slate-500 mt-1">${roleLabels[user.role] || user.role}</p>
                <p class="text-xs text-slate-400 mt-1">${joinedText}</p>
                ${user.departement && window.evcDepartement ? `<p class="text-xs text-slate-500 mt-1">📍 ${evcDepartement(user.departement)}</p>` : ''}
            </div>
        </div>

        ${user.bio ? `
            <div class="p-4 bg-slate-50 rounded-xl mb-4">
                <p class="text-xs font-bold text-slate-500 uppercase mb-2">Bio</p>
                <p class="text-sm text-slate-700 whitespace-pre-line">${user.bio}</p>
            </div>
        ` : ''}

        <div class="grid grid-cols-2 gap-3 mt-4">
            <a href="messages.html" class="p-4 bg-pink-50 hover:bg-pink-100 border border-pink-200 rounded-xl text-center transition-all">
                <i class="fa-solid fa-comments text-2xl text-brand-primary mb-2"></i>
                <p class="text-sm font-bold text-slate-900">Mes messages</p>
            </a>
            <a href="credits.html" class="p-4 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl text-center transition-all">
                <i class="fa-solid fa-coins text-2xl text-amber-500 mb-2"></i>
                <p class="text-sm font-bold text-slate-900">Mes récompenses</p>
            </a>
        </div>

        <div class="mt-6 pt-6 border-t border-slate-100 flex gap-3">
            <a href="compte.html" class="flex-1 py-3 text-center bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition-all">
                <i class="fa-solid fa-pen mr-2"></i> Modifier mon profil
            </a>
            <button onclick="logout()" class="px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl transition-all">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </div>
    `;
});
</script>

<script src="footer.js" defer></script>
</body>
</html>
