<!DOCTYPE html>
<html lang="fr" class="h-full cam-theme">
<head>
    <meta charset="UTF-8">
    <!-- Politique de sécurité : seules ces sources peuvent charger du code, des styles ou des données -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://api.e-visiocam.com https://cdn.socket.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.e-visiocam.com wss://api.e-visiocam.com http://localhost:3000 ws://localhost:3000; frame-src https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe — E-VISIOCAM</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#111113">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="auth-api.js?v=2"></script>
    <script src="legal-banner.js"></script>
    <link rel="stylesheet" href="style.css?v=20261003-favoris">
    <script src="maintenance.js" defer></script>
    <link rel="stylesheet" href="tailwind.css?v=20261005">
</head>
<body class="cam-home h-full flex flex-col font-sans">

<header class="cam-header bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1700px] mx-auto px-3 md:px-6 h-16 flex items-center gap-6">
        <div class="flex items-center lg:w-64 lg:shrink-0">
            <a href="index.html" class="flex items-center gap-2">
                <div class="cam-logo w-9 h-9 rounded-xl flex items-center justify-center text-white">
                    <i class="fa-solid font-bold text-lg fa-video"></i>
                </div>
                <span class="text-2xl font-black tracking-tight text-slate-900">
                    E-<span class="text-brand-primary">VISIOCAM</span>
                </span>
            </a>
        </div>
        <div class="ml-auto flex items-center gap-3">
            <div id="navAuth" class="flex items-center gap-2"></div>
        </div>
    </div>
</header>

<main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-md">
        <div class="cam-live-panel bg-white rounded-2xl p-6 border border-slate-200">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-11 h-11 rounded-xl bg-brand-primary text-slate-900 flex items-center justify-center">
                    <i class="fa-solid fa-key text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900">Nouveau mot de passe</h1>
                    <p class="text-xs text-slate-500">Compte : <span id="who">—</span></p>
                </div>
            </div>

            <p class="text-sm text-slate-500 mb-5">
                Un administrateur a réinitialisé votre mot de passe. Choisissez-en un nouveau
                pour retrouver votre compte : il vous sera demandé à chaque connexion.
            </p>

            <div id="errorBox" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold"></div>

            <form id="pwdForm" class="space-y-3">
                <div>
                    <label for="pwd1" class="block text-xs font-bold text-slate-700 mb-1">Nouveau mot de passe</label>
                    <input type="password" id="pwd1" autocomplete="new-password" required
                        class="w-full px-3 py-2.5 bg-slate-100 text-sm rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
                </div>
                <div>
                    <label for="pwd2" class="block text-xs font-bold text-slate-700 mb-1">Confirmer le mot de passe</label>
                    <input type="password" id="pwd2" autocomplete="new-password" required
                        class="w-full px-3 py-2.5 bg-slate-100 text-sm rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
                </div>

                <ul class="text-[11px] text-slate-500 space-y-1 pt-1">
                    <li id="r1"><i class="fa-solid fa-circle-xmark mr-1"></i>Au moins 8 caractères</li>
                    <li id="r2"><i class="fa-solid fa-circle-xmark mr-1"></i>Au moins une majuscule</li>
                    <li id="r3"><i class="fa-solid fa-circle-xmark mr-1"></i>Au moins un chiffre</li>
                </ul>

                <button type="submit" id="submitBtn"
                    class="w-full py-3 bg-brand-primary hover:bg-brand-hover text-slate-900 font-bold rounded-xl transition-colors">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Enregistrer mon mot de passe
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-500 mt-4">
            <a href="index.html" class="hover:text-brand-primary font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i>Retour à l'accueil</a>
        </p>
    </div>
</main>

<script>
(function() {
    if (typeof isLoggedIn !== 'function' || !isLoggedIn()) {
        window.location.href = 'login.html?redirect=nouveau-mdp.html';
        return;
    }

    const user = getCurrentUser() || {};
    document.getElementById('who').textContent = user.username || '—';

    const pwd1 = document.getElementById('pwd1');
    const pwd2 = document.getElementById('pwd2');
    const regles = [
        { el: 'r1', ok: v => v.length >= 8 },
        { el: 'r2', ok: v => /[A-Z]/.test(v) },
        { el: 'r3', ok: v => /[0-9]/.test(v) }
    ];
    function majRegles() {
        regles.forEach(r => {
            const li = document.getElementById(r.el);
            const ok = r.ok(pwd1.value);
            li.className = ok ? 'text-emerald-600 font-semibold' : 'text-slate-500';
            li.querySelector('i').className = ok ? 'fa-solid fa-circle-check mr-1' : 'fa-solid fa-circle-xmark mr-1';
        });
    }
    pwd1.addEventListener('input', majRegles);

    function erreur(msg) {
        const box = document.getElementById('errorBox');
        if (!msg) { box.classList.add('hidden'); return; }
        box.textContent = msg;
        box.classList.remove('hidden');
    }

    document.getElementById('pwdForm').addEventListener('submit', async e => {
        e.preventDefault();
        erreur('');
        const mdp = pwd1.value;
        if (regles.some(r => !r.ok(mdp))) return erreur('Le mot de passe ne respecte pas les trois règles.');
        if (mdp !== pwd2.value) return erreur('Les deux mots de passe ne sont pas identiques.');

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Enregistrement...';
        try {
            const data = await apiCall('/auth/change-password', { method: 'POST', body: JSON.stringify({ newPassword: mdp }) });
            if (data && data.token) saveToken(data.token);
            const frais = getCurrentUser() || user;
            frais.must_change_password = 0;
            saveUser(frais);
            showToast('✅ Nouveau mot de passe enregistré');
            setTimeout(() => { redirectByRole(frais); }, 900);
        } catch (err) {
            erreur(err.message || 'Enregistrement impossible');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> Enregistrer mon mot de passe';
        }
    });

    majRegles();
})();
</script>

<script src="footer.js" defer></script>
</body>
</html>
