<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- frame-src : le cadre n'affiche que des pages du site (jamais data:… ni un autre domaine) ; mailto: pour les liens e-mail des pages -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://api.e-visiocam.com https://cdn.socket.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.e-visiocam.com wss://api.e-visiocam.com; frame-src 'self' mailto:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>E-VISIOCAM</title>
    <meta name="description" content="E-VISIOCAM — E-VISIOCAM, chat et rencontres par webcam."/>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Appli installable (écran d'accueil) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="E-VisioCam">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#111113">
  <meta name="rating" content="adult">
  <!-- Cadre technique de la radio : Google indexe les vraies pages, pas celui-ci -->
  <meta name="robots" content="noindex, follow">
  <!-- Même thème que les pages (clé « evc-theme »), appliqué avant l'affichage -->
  <script src="theme.js?v=2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css?v=20261011-boutons">
  <!-- Indispensable : sans tailwind, la pastille réduite de la radio s'affichait en permanence (barre « TONIC ▮ ») -->
  <link rel="stylesheet" href="tailwind.css?v=20261009">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111113}
    html[data-theme="light"],html[data-theme="light"] body{background:#eef1f6}
    #evcPage{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}
    /* La radio : placée par le script ci-dessous (colonne de droite de l'accueil, sinon en bas à droite) */
    #radioWidgetFloating{transition:top .35s ease,left .35s ease,transform .35s ease;transform-origin:top left}
    #radioWidgetFloating.evc-coin{transform-origin:bottom right}
    /* Menu du compte ouvert dans la page : la radio s'efface pour ne pas le recouvrir (nav-auth.js) */
    html.evc-menu-compte #radioWidgetFloating{visibility:hidden}
    @media (prefers-reduced-motion:reduce){#radioWidgetFloating{transition:none}}
  </style>
  <script src="pages/app-shell-radio-persistante.js"></script>
</head>
<body>
  <iframe id="evcPage" title="E-VISIOCAM" allow="camera; microphone; autoplay; fullscreen"></iframe>
  <script src="pages/app-shell.js?v=2"></script>
  <script src="radio-widget.js"></script>
  <script src="radio-widget-floating.js?v=csp1"></script>
  <script src="pages/app-shell-radio-placement.js"></script>
  <!-- 📷 Caméra persistante : vit ici, comme la radio, pour survivre aux changements de page -->
  <script src="https://api.e-visiocam.com/socket.io/socket.io.js"></script>
  <script src="auth-api.js"></script>
  <script src="sfu-client.js"></script>
  <script src="aide-camera.js?v=1"></script>
  <script src="camera-session.js?v=2"></script>
  <script src="guide-installation.js?v=1"></script>
</body>
</html>
