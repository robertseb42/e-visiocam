<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white">
                <i class="fa-solid fa-video"></i>
            </div>
            <span class="text-2xl font-black text-slate-900">E-<span class="text-brand-primary">VISIOCAM</span></span>
        </a>
    </div>
</header>

<main class="max-w-[560px] w-full mx-auto flex-1 p-6 flex items-start sm:items-center">
    <div class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-sm w-full text-center legal-content">
        <div id="enCours">
            <div class="text-4xl mb-3">✉️</div>
            <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Confirmation en cours…</h1>
            <p class="text-sm text-slate-500"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Un instant, nous vérifions votre lien.</p>
        </div>

        <div id="ok" class="hidden">
            <div class="text-5xl mb-3">✅</div>
            <h1 class="text-2xl font-extrabold text-slate-900 mb-2" id="okTitre">Adresse e-mail confirmée</h1>
            <p class="text-sm text-slate-600 mb-6" id="okTexte"></p>
            <a href="login.html" id="okBouton" class="inline-block w-full py-3 rounded-xl bg-brand-primary hover:bg-brand-hover text-white font-bold text-sm" style="text-decoration:none;color:#fff">Me connecter</a>
        </div>

        <div id="ko" class="hidden">
            <div class="text-5xl mb-3">⚠️</div>
            <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Lien non valide</h1>
            <p class="text-sm text-slate-600 mb-6" id="koTexte"></p>
            <form id="renvoi" class="text-left space-y-2">
                <label for="login" class="block text-xs font-bold text-slate-700">Recevoir un nouveau lien</label>
                <input id="login" type="text" required maxlength="100" placeholder="Votre pseudo ou votre adresse e-mail" class="input-field w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none">
                <button type="submit" id="renvoiBtn" class="w-full py-3 rounded-xl bg-brand-primary hover:bg-brand-hover text-white font-bold text-sm">Envoyer un nouveau lien</button>
                <p id="renvoiMsg" class="text-xs text-center min-h-[1rem]"></p>
            </form>
            <a href="login.html" class="inline-block mt-4 text-sm font-bold">Retour à la connexion</a>
        </div>
    </div>
</main>

<script src="pages/verifier-email.js"></script>
<script src="footer.js" defer></script>
</body>
</html>
