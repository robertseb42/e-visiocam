<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié — E-VISIOCAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="auth-api.js"></script>
    <script src="legal-banner.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1547 50%, #0f172a 100%);
        }
        .card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .input-field { transition: all 0.2s ease; }
        .input-field:focus {
            border-color: #e91e63;
            box-shadow: 0 0 0 4px rgba(233, 30, 99, 0.1);
        }
    </style>
</head>
<body class="h-full min-h-screen gradient-bg flex items-center justify-center p-4">

<div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-3">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-white shadow-2xl">
                <i class="fa-solid fa-key text-2xl"></i>
            </div>
        </a>
        <h1 class="text-3xl font-black text-white mt-4">
            E-<span class="text-pink-500">VISIOCAM</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1">Mot de passe oublié</p>
    </div>

    <!-- Carte -->
    <div class="card rounded-3xl p-8">

        <div class="text-center mb-6">
            <h2 class="text-2xl font-extrabold text-slate-900">🔑 Mot de passe oublié ?</h2>
            <p class="text-xs text-slate-500 mt-1">
                Entrez votre email pour recevoir un lien de réinitialisation
            </p>
        </div>

        <!-- Message d'erreur -->
        <div id="errorBox" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-start gap-2">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
            <span id="errorText"></span>
        </div>

        <!-- Message de succès -->
        <div id="successBox" class="hidden mb-4 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-sm text-emerald-700">
            <div class="flex items-start gap-3">
                <i class="fa-solid fa-envelope-circle-check text-xl mt-0.5"></i>
                <div>
                    <p class="font-bold mb-1">Email envoyé !</p>
                    <p class="text-xs">Vérifiez votre boîte de réception (et vos spams). Le lien est valable 1 heure.</p>
                </div>
            </div>
        </div>

        <!-- Formulaire -->
        <form id="forgotForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">
                    Adresse email
                </label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="votre@email.com"
                        class="input-field w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none"
                    >
                </div>
            </div>

            <button
                type="submit"
                id="submitBtn"
                class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold rounded-xl shadow-lg text-sm flex items-center justify-center gap-2"
            >
                <i class="fa-solid fa-paper-plane"></i>
                <span id="submitText">Envoyer le lien</span>
                <i id="spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </form>

        <!-- Retour à la connexion -->
        <div class="mt-6 text-center">
            <a href="login.html" class="text-xs text-pink-500 font-bold hover:underline">
                <i class="fa-solid fa-arrow-left mr-1"></i> Retour à la connexion
            </a>
        </div>
    </div>

    <!-- Aide -->
    <div class="mt-6 p-4 bg-white/5 backdrop-blur rounded-2xl border border-white/10">
        <p class="text-xs text-slate-300 text-center">
            <i class="fa-solid fa-circle-info text-pink-400 mr-1"></i>
            Un problème ? Contactez-nous à
            <a href="mailto:contact@e-visiocam.com" class="text-pink-400 underline">contact@e-visiocam.com</a>
        </p>
    </div>

</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    if (!email) return;

    // Masquer les messages
    document.getElementById('errorBox').classList.add('hidden');
    document.getElementById('successBox').classList.add('hidden');

    // Désactiver le bouton
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('submitText');
    const spinner = document.getElementById('spinner');
    btn.disabled = true;
    btn.style.opacity = '0.7';
    btnText.textContent = 'Envoi...';
    spinner.classList.remove('hidden');

    try {
        const response = await fetch(API_URL + '/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Erreur');
        }

        // Afficher le succès
        document.getElementById('successBox').classList.remove('hidden');
        document.getElementById('email').value = '';

    } catch (err) {
        document.getElementById('errorText').textContent = err.message;
        document.getElementById('errorBox').classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
        btnText.textContent = 'Envoyer le lien';
        spinner.classList.add('hidden');
    }
});
</script>

</body>
</html>
