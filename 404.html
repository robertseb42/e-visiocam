    <style>
        body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Inter,Arial,sans-serif;background:#111113;color:#f5f5f7}
        html[data-theme="light"] body{background:#f1f5f9;color:#0f172a}

        .nf p{color:#b1b1bd;margin:0 0 28px;line-height:1.6}
        html[data-theme="light"] .nf p{color:#64748b}
        .nf-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
        .nf-btn{display:inline-flex;align-items:center;padding:13px 22px;border-radius:12px;font-weight:800;font-size:14px;text-decoration:none;border:1px solid #ffe500;background:#ffe500;color:#111113}
        .nf-btn--ghost{background:transparent;color:inherit;border-color:#ffffff66}
        html[data-theme="light"] .nf-btn{background:#e91e63;border-color:#e91e63;color:#fff}
        html[data-theme="light"] .nf-btn--ghost{background:#fff;color:#0f172a;border-color:#cbd5e1}
        .nf-btn:focus-visible{outline:2px solid currentColor;outline-offset:3px}
