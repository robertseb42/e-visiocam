<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<header class="cam-header bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1700px] mx-auto px-3 md:px-6 h-16 flex items-center gap-6">
        <div class="flex items-center lg:w-64 lg:shrink-0">
            <a class="flex items-center gap-2" href="index.html">
                <div class="cam-logo w-9 h-9 rounded-xl flex items-center justify-center text-white">
                    <i class="fa-solid font-bold text-lg fa-video"></i>
                </div>
                <span class="text-2xl font-black tracking-tight text-slate-900">E-<span class="text-brand-primary">VISIOCAM</span></span>
            </a>
        </div>
        <nav class="cam-topnav hidden lg:flex items-center gap-0.5 xl:gap-1 whitespace-nowrap text-sm font-medium">
            <a class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors" href="index.html">Accueil</a>
            <a class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors" href="live.html">En direct</a>
            <a class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors" href="modeles.html">Modèles</a>
            <a class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors" href="salons.html">Salons</a>
            <a class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors" href="messages.html">Messages</a>
            <a class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary transition-colors" href="credits.html">Récompenses</a>
        </nav>
        <div class="ml-auto flex items-center gap-3 sm:gap-5">
            <div class="cam-search relative hidden sm:block w-48 md:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input aria-label="Rechercher un modèle" class="w-full pl-9 pr-4 py-2 bg-slate-100 focus:bg-white text-sm rounded-full border border-transparent focus:border-brand-primary focus:outline-none transition-all" placeholder="Rechercher un modèle..." type="text"/>
            </div>
            <button aria-label="Changer de thème" class="p-2 text-slate-600 hover:text-brand-primary rounded-full hover:bg-slate-100 transition-colors text-lg leading-none" data-theme-toggle title="Changer de thème" type="button">☀️</button>
            <button data-nav-bell aria-label="Notifications" onclick="ouvrirNotifications()" class="relative p-2 text-slate-600 hover:text-brand-primary rounded-full hover:bg-slate-100 transition-colors">
                <i class="fa-regular fa-bell text-lg"></i>
                <span data-nav-bell-badge class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-brand-primary text-slate-900 text-[10px] font-bold items-center justify-center ring-2 ring-white">0</span>
            </button>
            <div id="navAuth" class="flex items-center gap-2"></div>
        </div>
    </div>
</header>

<main class="max-w-[1200px] w-full mx-auto flex-1 p-6">
    <div class="mb-6">
        <h1 class="text-3xl font-extrabold text-slate-900"><i class="fa-solid fa-heart ev-ico" aria-hidden="true"></i> Mes favoris</h1>
        <p class="text-sm text-slate-500 mt-1">Retrouvez vos modèles et salons préférés. Vous êtes prévenu quand un modèle suivi passe en direct.</p>
    </div>

    <section class="bg-white rounded-2xl p-5 mb-6 shadow-sm border border-slate-200/80" aria-labelledby="favModelsTitle">
        <h2 id="favModelsTitle" class="font-bold text-slate-900 mb-4"><i class="fa-solid fa-star ev-ico" aria-hidden="true"></i> Modèles suivis</h2>
        <div id="favModels" class="space-y-2"><p class="text-sm text-slate-400 py-6 text-center">Chargement…</p></div>
    </section>

    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80" aria-labelledby="favSalonsTitle">
        <h2 id="favSalonsTitle" class="font-bold text-slate-900 mb-4"><i class="fa-solid fa-comments ev-ico" aria-hidden="true"></i> Salons favoris</h2>
        <div id="favSalons" class="space-y-2"><p class="text-sm text-slate-400 py-6 text-center">Chargement…</p></div>
    </section>
</main>


<script>
// ============================================================
// Mes favoris : modèles suivis (alerte email réglable) et salons
// ============================================================
if (!isLoggedIn()) window.location.href = 'login.html?redirect=favoris.html';
const escF = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ligneModele(m) {
    return `<div class="flex flex-wrap items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200">
        <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-brand-primary to-purple-600 text-white flex items-center justify-center font-black">${escF(m.username.charAt(0).toUpperCase())}</div>
        <div class="flex-1 min-w-[160px]">
            <p class="font-bold text-slate-900">${escF(m.username)} ${m.isLive ? '<span class="ml-1 text-[10px] bg-rose-500 text-white font-bold px-2 py-0.5 rounded-full live-pulse">● EN DIRECT</span>' : ''}</p>
            <p class="text-xs text-slate-500 truncate">${m.isLive ? escF(m.liveSalon) + ' · ' + m.viewers + ' spectateur' + (m.viewers > 1 ? 's' : '') : escF(m.bio || 'Hors ligne')}</p>
        </div>
        <label class="flex items-center gap-2 text-xs font-semibold text-slate-600 cursor-pointer" title="Recevoir un email quand ce modèle lance un live">
            <input type="checkbox" data-notify="${m.id}" ${m.notify ? 'checked' : ''} class="rounded"> Alerte email
        </label>
        ${m.isLive ? '<a href="live.html" class="px-4 py-2 bg-brand-primary hover:bg-brand-hover text-white text-xs font-bold rounded-xl">Regarder</a>' : ''}
        <button type="button" class="ev-fav" data-fav="model:${m.id}" aria-pressed="true" title="Retirer des favoris"><i class="fa-solid fa-heart"></i></button>
    </div>`;
}
function ligneSalon(s) {
    return `<div class="flex flex-wrap items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200">
        <div class="w-11 h-11 rounded-xl bg-slate-100 flex items-center justify-center text-2xl">${escF(s.icon)}</div>
        <div class="flex-1 min-w-[160px]">
            <p class="font-bold text-slate-900">${escF(s.name)} ${s.isPrivate ? '<span class="ml-1 text-[10px] bg-pink-50 text-brand-primary font-bold px-2 py-0.5 rounded-full">VIP</span>' : ''}</p>
            <p class="text-xs text-slate-500 truncate">${escF(s.description)}</p>
        </div>
        <a href="${s.isPrivate ? 'salons.html' : 'chat.html?theme=' + encodeURIComponent(s.slug)}" class="px-4 py-2 bg-brand-primary hover:bg-brand-hover text-white text-xs font-bold rounded-xl">Entrer</a>
        <button type="button" class="ev-fav" data-fav="salon:${escF(s.slug)}" aria-pressed="true" title="Retirer des favoris"><i class="fa-solid fa-heart"></i></button>
    </div>`;
}
async function chargerFavoris() {
    try {
        const d = await apiCall('/favorites');
        document.getElementById('favModels').innerHTML = (d.models || []).length ? d.models.map(ligneModele).join('')
            : '<p class="text-sm text-slate-500 py-6 text-center">Aucun modèle suivi. Touchez le ❤️ sur la page <a href="modeles.html" class="text-brand-primary font-bold underline">Modèles</a>.</p>';
        document.getElementById('favSalons').innerHTML = (d.salons || []).length ? d.salons.map(ligneSalon).join('')
            : '<p class="text-sm text-slate-500 py-6 text-center">Aucun salon favori. Touchez le ❤️ sur la page <a href="salons.html" class="text-brand-primary font-bold underline">Salons</a>.</p>';
    } catch (e) {
        document.getElementById('favModels').innerHTML = '<p class="text-sm text-rose-500 py-6 text-center">' + escF(e.message) + '</p>';
    }
}
document.addEventListener('change', async e => {
    const c = e.target.closest('[data-notify]'); if (!c) return;
    try {
        await apiCall('/favorites/model/' + encodeURIComponent(c.dataset.notify), { method: 'PUT', body: JSON.stringify({ notify: c.checked }) });
        showToast(c.checked ? '📧 Alerte email activée' : 'Alerte email coupée');
    } catch (err) { c.checked = !c.checked; showToast(err.message, 'error'); }
});
document.addEventListener('evc:favori', e => { if (!e.detail.favorite) setTimeout(chargerFavoris, 300); });
chargerFavoris();
setInterval(chargerFavoris, 60000);
</script>
<script src="favorites.js"></script>
<script src="radio-widget.js"></script>
<script src="radio-widget-floating.js"></script>
<script src="footer.js" defer></script>
</body>
</html>
