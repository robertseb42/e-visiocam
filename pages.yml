# Déploiement GitHub Pages filtré : publie uniquement le site, PAS les tests ni les sources de build.
# Pour l'activer : Settings → Pages → "Build and deployment" → Source = "GitHub Actions".
# (Ce fichier doit être dans .github/workflows/ pour que GitHub le lise : à la racine, il était ignoré.)
name: Deploy site (filtré)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le dossier publié (exclusions)
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude '*.test.js' \
            --exclude 'tailwind/' \
            --exclude 'tailwind.config.js' \
            --exclude 'input.css' \
            --exclude 'outils/' \
            --exclude 'pages.yml' \
            --exclude '*.md' \
            --exclude '/ambiance-lounge.jpg' \
            --exclude '/ambiance-musique.jpg' \
            --exclude '/ambiance-rencontres.jpg' \
            --exclude '/hero-neon.jpg' \
            --exclude '/partage.jpg'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
