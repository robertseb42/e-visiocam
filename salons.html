<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <title>Salons — E-VISIOCAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth-api.js"></script>
    <script src="legal-banner.js"></script>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white"><i class="fa-solid fa-video"></i></div>
            <span class="text-2xl font-black text-slate-900">E-<span class="text-brand-primary">VISIOCAM</span></span>
        </a>
        <nav class="hidden lg:flex items-center gap-1 text-sm font-medium">
            <a href="index.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Accueil</a>
            <a href="live.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">En direct</a>
            <a href="modeles.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Modèles</a>
            <a href="salons.html" class="px-3 py-2 text-brand-primary border-b-2 border-brand-primary font-semibold">Salons</a>
            <a href="messages.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Messages</a>
            <a href="credits.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Crédits</a>
        </nav>
        <a href="compte.html" class="flex items-center gap-2 pl-2 pr-4 py-1.5 bg-slate-100 rounded-full text-sm font-semibold">
            <div class="w-7 h-7 rounded-full bg-gradient-to-r from-purple-500 to-brand-primary text-white flex items-center justify-center text-xs font-bold">3</div>
        </a>
    </div>
</header>

<main class="max-w-[1700px] w-full mx-auto flex-1 p-6">
    <div class="mb-6 flex flex-col md:flex-row justify-between md:items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900">💬 Salons</h1>
            <p class="text-sm text-slate-500 mt-1">Rejoignez un salon public ou créez le vôtre</p>
        </div>
        <button onclick="openModal('createSalonModal')" class="px-5 py-2.5 bg-brand-primary hover:bg-brand-hover text-white text-sm font-bold rounded-xl shadow-md shadow-pink-500/20">
            <i class="fa-solid fa-plus mr-1"></i> Créer un salon
        </button>
    </div>

    <h2 class="text-lg font-bold text-slate-800 mb-3">🌐 Salons publics</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8" id="publicSalons"></div>

    <h2 class="text-lg font-bold text-slate-800 mb-3">🔒 Salons privés <span class="text-xs font-normal text-slate-500">(accès sur invitation)</span></h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="privateSalons"></div>
</main>

<div id="createSalonModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
        <button onclick="closeModal('createSalonModal')" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        <h3 class="text-xl font-extrabold text-slate-900 mb-1">Créer un salon</h3>
        <p class="text-xs text-slate-500 mb-4">Donnez un nom à votre salon</p>
        <form onsubmit="event.preventDefault(); closeModal('createSalonModal'); showToast('Salon créé avec succès !');" class="space-y-3">
            <input type="text" required placeholder="Nom du salon" maxlength="40" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
            <select class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
                <option>Public</option>
                <option>Privé</option>
            </select>
            <button type="submit" class="w-full py-2.5 bg-brand-primary hover:bg-brand-hover text-white font-bold rounded-xl text-sm">Créer</button>
        </form>
    </div>
</div>

<footer class="bg-white border-t border-slate-200 py-6">
    <div class="max-w-[1700px] mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-slate-500">
        <p>© 2025 E-VISIOCAM.</p>
        <div class="flex gap-4">
            <a href="a-propos.html" class="hover:text-brand-primary">À propos</a>
            <a href="cgu.html" class="hover:text-brand-primary">CGU</a>
            <a href="confidentialite.html" class="hover:text-brand-primary">Confidentialité</a>
            <a href="contact.html" class="hover:text-brand-primary">Contact</a>
        </div>
    </div>
</footer>

<script>
const publicSalons = [
    { name: "Salon Général", users: 128, desc: "Le salon principal, toutes discussions bienvenues", icon: "🌍" },
    { name: "Salon Français", users: 86, desc: "Discussions en français uniquement", icon: "🇫🇷" },
    { name: "Salon International", users: 97, desc: "English, Español, Deutsch welcome!", icon: "🌐" },
    { name: "Salon Couples", users: 54, desc: "Espace réservé aux couples", icon: "💕" },
    { name: "Salon Amateurs", users: 63, desc: "Pour les amateurs et nouveaux venus", icon: "✨" },
    { name: "Salon Musique", users: 42, desc: "Partagez vos playlists et coups de cœur", icon: "🎵" },
];

const privateSalons = [
    { name: "VIP Lounge", users: 12, desc: "Salon privé réservé aux membres VIP", icon: "👑" },
    { name: "Salon Premium", users: 8, desc: "Accès réservé aux abonnés Premium", icon: "💎" },
];

function renderSalons(items, containerId, isPrivate = false) {
    document.getElementById(containerId).innerHTML = items.map(s => `
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm hover:shadow-md transition-all">
            <div class="flex items-start justify-between mb-3">
                <div class="text-3xl">${s.icon}</div>
                <span class="text-xs bg-pink-50 text-brand-primary font-bold px-2 py-1 rounded-full">
                    <i class="fa-solid fa-users text-[10px] mr-1"></i>${s.users}
                </span>
            </div>
            <h3 class="font-bold text-slate-900">${s.name}</h3>
            <p class="text-xs text-slate-500 mt-1 mb-4">${s.desc}</p>
            <a href="index.html" class="block text-center w-full py-2 ${isPrivate ? 'bg-slate-800 hover:bg-slate-700' : 'bg-brand-primary hover:bg-brand-hover'} text-white text-xs font-bold rounded-xl transition-colors">
                ${isPrivate ? '<i class="fa-solid fa-lock mr-1"></i>Demander accès' : 'Rejoindre'}
            </a>
        </div>
    `).join('');
}

renderSalons(publicSalons, 'publicSalons');
renderSalons(privateSalons, 'privateSalons', true);
</script>

</body>
</html>
