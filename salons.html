<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

        <div class="flex items-center lg:w-64 lg:shrink-0">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white"><i class="fa-solid fa-video"></i></div>
                <span class="text-2xl font-black text-slate-900">E-<span class="text-brand-primary">VISIOCAM</span></span>
            </a>
        </div>
        <nav class="hidden lg:flex items-center gap-0.5 xl:gap-1 whitespace-nowrap text-sm font-medium">
            <a href="index.html" style="padding-left:0" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary">Accueil</a>
            <a href="live.html" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary">En direct</a>
            <a href="modeles.html" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary">Modèles</a>
            <a href="salons.html" class="px-2 xl:px-3 py-2 text-brand-primary border-b-2 border-brand-primary font-semibold">Salons</a>
            <a href="messages.html" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary">Messages</a>
            <a href="credits.html" class="px-2 xl:px-3 py-2 text-slate-600 hover:text-brand-primary">Crédits</a>
        </nav>
        <a href="compte.html" class="ml-auto flex items-center gap-2 pl-2 pr-4 py-1.5 bg-slate-100 rounded-full text-sm font-semibold">
            <div class="w-7 h-7 rounded-full bg-gradient-to-r from-purple-500 to-brand-primary text-white flex items-center justify-center text-xs font-bold">3</div>
        </a>
    </div>
</header>

<main class="max-w-[1700px] w-full mx-auto flex-1 p-6">
    <div class="mb-6 flex flex-col md:flex-row justify-between md:items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900">💬 Salons</h1>
            <p class="text-sm text-slate-500 mt-1">Rejoignez un salon public ou créez le vôtre</p>
        </div>
        <div class="flex items-center gap-3">
            <a id="manageLink" href="moderation-salons.html" class="hidden px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl shadow-md">
                <i class="fa-solid fa-lock mr-1"></i> Demandes d'accès
            </a>
            <button onclick="openModal('createSalonModal')" class="px-5 py-2.5 bg-brand-primary hover:bg-brand-hover text-white text-sm font-bold rounded-xl shadow-md shadow-pink-500/20">
                <i class="fa-solid fa-plus mr-1"></i> Créer un salon
            </button>
        </div>
    </div>

    <h2 class="text-lg font-bold text-slate-800 mb-3">🌐 Salons publics</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8" id="publicSalons"></div>

    <h2 class="text-lg font-bold text-slate-800 mb-3">🔒 Salons privés <span class="text-xs font-normal text-slate-500">(accès sur invitation)</span></h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="privateSalons"></div>
</main>

<div id="createSalonModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
        <button onclick="closeModal('createSalonModal')" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        <h3 class="text-xl font-extrabold text-slate-900 mb-1">Créer un salon</h3>
        <p class="text-xs text-slate-500 mb-4">Donnez un nom à votre salon</p>
        <form id="createSalonForm" class="space-y-3">
            <input type="text" id="newSalonName" required placeholder="Nom du salon" maxlength="40" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
            <select id="newSalonType" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
                <option>Public</option>
                <option>Privé</option>
            </select>
            <button type="submit" class="w-full py-2.5 bg-brand-primary hover:bg-brand-hover text-white font-bold rounded-xl text-sm">Créer</button>
        </form>
    </div>
</div>

<footer class="bg-white border-t border-slate-200 py-6">
    <div class="max-w-[1700px] mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-slate-500">
        <p>© 2025 E-VISIOCAM.</p>
        <div class="flex gap-4">
            <a href="a-propos.html" class="hover:text-brand-primary">À propos</a>
            <a href="cgu.html" class="hover:text-brand-primary">CGU</a>
            <a href="confidentialite.html" class="hover:text-brand-primary">Confidentialité</a>
            <a href="contact.html" class="hover:text-brand-primary">Contact</a>
        </div>
    </div>
</footer>

<script>
// "slug" = identifiant du salon, utilisé dans l'adresse : room.html?theme=<slug>
// La liste vient du serveur (/api/salons/list) ; ce repli sert uniquement si l'API
// n'est pas joignable. Aucun chiffre inventé : les compteurs viennent du serveur.
const REPLI_PUBLICS = [
    { slug: "general",       name: "Salon Général",       description: "Le salon principal, toutes discussions bienvenues", icon: "🌍" },
    { slug: "francais",      name: "Salon Français",      description: "Discussions en français uniquement", icon: "🇫🇷" },
    { slug: "international", name: "Salon International", description: "English, Español, Deutsch welcome!", icon: "🌐" },
    { slug: "couples",       name: "Salon Couples",       description: "Espace réservé aux couples", icon: "💕" },
    { slug: "amateurs",      name: "Salon Amateurs",      description: "Pour les amateurs et nouveaux venus", icon: "✨" },
    { slug: "musique",       name: "Salon Musique",       description: "Partagez vos playlists et coups de cœur", icon: "🎵" },
];
const REPLI_PRIVES = [
    { slug: "vip",     name: "VIP Lounge",    description: "Salon privé réservé aux membres VIP", icon: "👑", isPrivate: true },
    { slug: "premium", name: "Salon Premium", description: "Accès réservé aux abonnés Premium", icon: "💎", isPrivate: true },
];

const say = m => (window.showToast ? showToast(m) : alert(m));
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderSalons(items, containerId, isPrivate = false) {
    document.getElementById(containerId).innerHTML = items.map(s => `
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm hover:shadow-md transition-all">
            <div class="flex items-start justify-between mb-3">
                <div class="text-3xl">${s.icon || '💬'}</div>
                ${s.isHidden ? `<span class="text-[10px] bg-slate-200 text-slate-600 font-bold px-2 py-1 rounded-full" title="Salon masqué (visible par l'équipe uniquement)">🚫 Masqué</span>` : ''}
                ${typeof s.members === 'number'
                    ? `<span class="text-xs bg-pink-50 text-brand-primary font-bold px-2 py-1 rounded-full" title="Membres">
                           <i class="fa-solid fa-users text-[10px] mr-1"></i>${s.members}
                       </span>`
                    : ''}
            </div>
            <h3 class="font-bold text-slate-900">${esc(s.name)}</h3>
            <p class="text-xs text-slate-500 mt-1 mb-4">${esc(s.description || '')}</p>
            ${isPrivate
                ? `<div data-access="${esc(s.slug)}"><span class="block text-center w-full py-2 bg-slate-800 text-white text-xs font-bold rounded-xl opacity-60"><i class="fa-solid fa-lock mr-1"></i>Vérification…</span></div>`
                : `<a href="room.html?theme=${encodeURIComponent(s.slug)}" class="block text-center w-full py-2 bg-brand-primary hover:bg-brand-hover text-white text-xs font-bold rounded-xl transition-colors">Rejoindre</a>`}
        </div>
    `).join('');
}

// ---- Liste des salons : serveur d'abord, repli local sinon ----
async function loadSalons() {
    let salons = null;
    try {
        if (typeof apiCall === 'function') {
            const data = await apiCall('/salons/list');
            if (data && Array.isArray(data.salons) && data.salons.length) salons = data.salons;
        }
    } catch (e) { salons = null; }

    const publics = salons ? salons.filter(s => !s.isPrivate) : REPLI_PUBLICS;
    const prives = salons ? salons.filter(s => s.isPrivate) : REPLI_PRIVES;
    renderSalons(publics, 'publicSalons', false);
    renderSalons(prives, 'privateSalons', true);
    refreshAccess();
}

// ---- Salons privés : accès accordé par un responsable ou un administrateur ----
async function refreshAccess() {
    const base = 'block text-center w-full py-2 text-white text-xs font-bold rounded-xl transition-colors ';
    for (const el of document.querySelectorAll('[data-access]')) {
        const slug = el.dataset.access, st = await SalonAccess.status(slug);
        if (st === 'approved') el.innerHTML = `<a href="room.html?theme=${encodeURIComponent(slug)}" class="${base} bg-brand-primary hover:bg-brand-hover">Entrer</a>`;
        else if (st === 'pending') el.innerHTML = `<span class="${base} bg-amber-500 cursor-default"><i class="fa-solid fa-hourglass-half mr-1"></i>Demande en attente</span>`;
        else if (st === 'refused') el.innerHTML = `<span class="${base} bg-slate-400 cursor-default">Demande refusée</span>`;
        else el.innerHTML = `<button onclick="askAccess('${slug}')" class="${base} bg-slate-800 hover:bg-slate-700"><i class="fa-solid fa-lock mr-1"></i>Demander accès</button>`;
    }
}
async function askAccess(slug) {
    try { await SalonAccess.request(slug); say('Demande envoyée aux modérateurs'); }
    catch (e) { say("Impossible d'envoyer la demande"); }
    refreshAccess();
}

// ---- Création réelle d'un salon (POST /api/salons) ----
const formSalon = document.getElementById('createSalonForm');
if (formSalon) formSalon.onsubmit = async e => {
    e.preventDefault();
    const name = document.getElementById('newSalonName').value.trim();
    const type = document.getElementById('newSalonType').value;
    if (name.length < 3) { say('Nom trop court (3 caractères minimum)'); return; }
    if (type === 'Privé') { say('Les salons privés sont créés par l\'administration'); return; }
    if (typeof isLoggedIn === 'function' && !isLoggedIn()) {
        say('Connectez-vous pour créer un salon');
        setTimeout(() => { location.href = 'login.html?redirect=salons.html'; }, 1200);
        return;
    }
    try {
        const data = await apiCall('/salons', { method: 'POST', body: JSON.stringify({ name }) });
        closeModal('createSalonModal');
        say('Salon créé : ' + data.salon.name);
        setTimeout(() => { location.href = 'room.html?theme=' + encodeURIComponent(data.salon.slug); }, 700);
    } catch (err) {
        say(err.message || 'Création du salon impossible');
    }
};

loadSalons();
if (new URLSearchParams(location.search).get('acces')) say('Salon privé : demandez l\'accès, un modérateur doit l\'accepter.');

// ---- Le bouton "Demandes d'accès" n'apparaît que pour les responsables / super admin ----
if (typeof SalonAccess !== 'undefined' && SalonAccess.canManage) {
    SalonAccess.canManage().then(ok => {
        if (ok) document.getElementById('manageLink').classList.remove('hidden');
    }).catch(() => {});
}
</script>
<script src="radio-widget.js"></script>
<script src="radio-widget-floating.js"></script>
</body>
</html>
