<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <title>Mon compte — E-VISIOCAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white"><i class="fa-solid fa-video"></i></div>
            <span class="text-2xl font-black text-slate-900">E-<span class="text-brand-primary">VISIOCAM</span></span>
        </a>
        <nav class="hidden lg:flex items-center gap-1 text-sm font-medium">
            <a href="index.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Accueil</a>
            <a href="live.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">En direct</a>
            <a href="modeles.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Modèles</a>
            <a href="salons.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Salons</a>
            <a href="credits.html" class="px-3 py-2 text-slate-600 hover:text-brand-primary">Crédits</a>
        </nav>
    </div>
</header>

<main class="max-w-[1200px] w-full mx-auto flex-1 p-6">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-6">👤 Mon compte</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Card profil -->
        <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm text-center">
            <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-r from-purple-500 to-brand-primary text-white flex items-center justify-center text-4xl font-bold mb-3">3</div>
            <h2 class="text-xl font-bold text-slate-900">Pseudo123</h2>
            <p class="text-xs text-slate-500">Membre depuis janvier 2025</p>
            <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-3 gap-2 text-center">
                <div><p class="text-xl font-black text-brand-primary">7</p><p class="text-[10px] text-slate-500">Favoris</p></div>
                <div><p class="text-xl font-black text-brand-primary">250</p><p class="text-[10px] text-slate-500">Crédits</p></div>
                <div><p class="text-xl font-black text-brand-primary">3</p><p class="text-[10px] text-slate-500">Achats</p></div>
            </div>
        </div>

        <!-- Paramètres -->
        <div class="lg:col-span-2 bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm">
            <h3 class="font-bold text-slate-900 mb-4">Paramètres du compte</h3>
            <form onsubmit="event.preventDefault(); showToast('Modifications enregistrées !');" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Pseudo</label>
                    <input type="text" value="Pseudo123" class="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
                    <input type="email" value="mon@email.com" class="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Date de naissance</label>
                    <input type="date" class="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Bio</label>
                    <textarea rows="3" class="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary" placeholder="Parlez-nous un peu de vous..."></textarea>
                </div>
                <button class="px-6 py-2.5 bg-brand-primary hover:bg-brand-hover text-white font-bold rounded-xl text-sm">Enregistrer</button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100">
                <h3 class="font-bold text-rose-600 mb-3 text-sm">Zone dangereuse</h3>
                <button onclick="if(confirm('Supprimer votre compte ? Cette action est irréversible.')) showToast('Demande envoyée');" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold rounded-xl border border-rose-200">
                    Supprimer mon compte
                </button>
            </div>
        </div>
    </div>
</main>

</body>
</html>
