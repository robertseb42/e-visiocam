<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en direct — E-VISIOCAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="legal-banner.js"></script>
    <script src="auth-api.js"></script>
    <script src="nav-auth.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .live-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .message { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emoji-float {
            position: fixed;
            font-size: 2rem;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-200px) scale(1.5); }
        }
        @keyframes gift-bounce {
            0% { transform: scale(0.5) rotate(-10deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<script>
(function() {
    if (typeof isLoggedIn !== 'function' || !isLoggedIn()) {
        window.location.href = 'login.html?redirect=chat.html';
        return;
    }
})();
</script>

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white">
                <i class="fa-solid fa-comments"></i>
            </div>
            <span class="text-2xl font-black text-slate-900">Chat <span class="text-pink-500">Live</span></span>
        </a>
        <div class="flex items-center gap-3">
            <div id="connectionStatus" class="text-xs font-bold px-3 py-1.5 rounded-full bg-amber-100 text-amber-700">
                ⚡ Connexion...
            </div>
            <div id="navAuth" class="flex items-center gap-2"></div>
        </div>
    </div>
</header>

<main class="max-w-[1700px] w-full mx-auto flex-1 p-4 flex gap-4 overflow-hidden">

    <aside class="hidden lg:flex flex-col w-64 shrink-0 gap-4">
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm">
            <h3 class="font-bold text-slate-900 text-sm mb-3">💬 Salons</h3>
            <div class="space-y-1 text-xs font-medium">
                <button onclick="joinSalon('Salon Général', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl bg-pink-50 border border-pink-200/60 text-pink-500 font-bold">
                    🌍 Salon Général
                </button>
                <button onclick="joinSalon('Salon Français', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    🇫🇷 Salon Français
                </button>
                <button onclick="joinSalon('Salon International', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    🌐 Salon International
                </button>
                <button onclick="joinSalon('Salon Couples', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    💕 Salon Couples
                </button>
                <button onclick="joinSalon('Salon Amateurs', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    ✨ Salon Amateurs
                </button>
            </div>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex-1 overflow-hidden flex flex-col">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-slate-900 text-sm">🟢 En ligne</h3>
                <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full" id="onlineCount">0</span>
            </div>
            <div id="onlineUsers" class="space-y-2 overflow-y-auto text-xs">
                <p class="text-slate-400 text-center py-4">Chargement...</p>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
            <div>
                <h2 class="font-bold text-slate-900 text-sm" id="currentSalon">🌍 Salon Général</h2>
                <p class="text-xs text-slate-500">Chat en temps réel</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="sendReaction('❤️')" class="w-9 h-9 rounded-full bg-rose-50 hover:bg-rose-100 flex items-center justify-center" title="J'aime">❤️</button>
                <button onclick="sendReaction('👏')" class="w-9 h-9 rounded-full bg-amber-50 hover:bg-amber-100 flex items-center justify-center" title="Bravo">👏</button>
                <button onclick="sendReaction('🔥')" class="w-9 h-9 rounded-full bg-orange-50 hover:bg-orange-100 flex items-center justify-center" title="Feu">🔥</button>
                <button onclick="openGiftModal()" class="px-3 h-9 rounded-full bg-pink-500 hover:bg-pink-600 text-white flex items-center gap-1 text-xs font-bold">
                    <i class="fa-solid fa-gift"></i> Cadeau
                </button>
                <button onclick="openReportModal()" class="w-9 h-9 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-500 flex items-center justify-center transition-colors" title="Signaler">
                    <i class="fa-solid fa-flag"></i>
                </button>
            </div>
        </div>

        <div id="chatMessages" class="flex-1 p-5 overflow-y-auto space-y-3 bg-slate-50/30">
            <div class="text-center text-xs text-slate-400 py-4">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Chargement des messages...
            </div>
        </div>

        <form id="chatForm" onsubmit="sendMessage(event)" class="p-3 border-t border-slate-100 flex items-center gap-2">
            <input type="text" id="chatInput" placeholder="Écrire un message..." maxlength="500" autocomplete="off"
                class="flex-1 px-4 py-3 bg-slate-100 focus:bg-white text-sm rounded-full border border-transparent focus:border-brand-primary focus:outline-none transition-all">
            <button type="submit" class="w-11 h-11 rounded-full bg-pink-500 hover:bg-pink-600 text-white flex items-center justify-center shrink-0 active:scale-95 shadow-md">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>
</main>

<!-- MODAL CADEAUX -->
<div id="giftModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeGiftModal()" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>

        <div class="text-center mb-5">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 text-white flex items-center justify-center text-2xl mx-auto mb-2">
                <i class="fa-solid fa-gift"></i>
            </div>
            <h3 class="text-xl font-extrabold text-slate-900">Envoyer un cadeau</h3>
            <p class="text-xs text-slate-500 mt-1">
                Votre solde : <span id="giftBalance" class="font-bold text-pink-500">—</span> crédits
            </p>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-bold text-slate-700 mb-1">Destinataire (optionnel)</label>
            <input type="text" id="giftReceiver" placeholder="Pseudo du destinataire (vide = tout le salon)"
                class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
        </div>

        <div class="grid grid-cols-3 md:grid-cols-4 gap-3 mb-4" id="giftsGrid">
            <p class="text-slate-400 text-center col-span-full py-8">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Chargement...
            </p>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-bold text-slate-700 mb-1">Message (optionnel)</label>
            <input type="text" id="giftMessage" maxlength="100" placeholder="Un petit mot..."
                class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
        </div>

        <button onclick="confirmSendGift()" id="giftSendBtn" disabled
            class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold rounded-xl text-sm disabled:opacity-50 disabled:cursor-not-allowed">
            Sélectionnez un cadeau
        </button>
    </div>
</div>

<!-- MODAL SIGNALEMENT -->
<div id="reportModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
        <button onclick="closeReportModal()" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <div class="text-center mb-4">
            <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-xl mx-auto mb-2">
                <i class="fa-solid fa-flag"></i>
            </div>
            <h3 class="text-lg font-extrabold text-slate-900">Signaler un contenu</h3>
            <p class="text-xs text-slate-500 mt-1">Aidez-nous à garder la communauté saine</p>
        </div>

        <form onsubmit="submitReport(event)" class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Pseudo à signaler</label>
                <input type="text" id="reportTarget" required placeholder="Ex: Pseudo123"
                    class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Raison</label>
                <select id="reportReason" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
                    <option value="">-- Choisir --</option>
                    <option value="contenu_illegal">🚨 Contenu illégal</option>
                    <option value="mineur">⚠️ Mineur présent</option>
                    <option value="violence">⚔️ Violence</option>
                    <option value="harcelement">😠 Harcèlement</option>
                    <option value="contenu_sexuel_non_consenti">🚫 Contenu non consenti</option>
                    <option value="spam">📢 Spam / Publicité</option>
                    <option value="comportement">😤 Comportement inapproprié</option>
                    <option value="autre">❓ Autre</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Description (optionnel)</label>
                <textarea id="reportDescription" rows="3" maxlength="500"
                    placeholder="Décrivez ce qui s'est passé..."
                    class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none resize-none"></textarea>
            </div>
            <button type="submit" class="w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs">
                🚩 Envoyer le signalement
            </button>
        </form>
    </div>
</div>

<script>
let socket = null;
let currentSalon = 'Salon Général';
let currentUser = null;
let gifts = [];
let selectedGift = null;
let userBalance = 0;

document.addEventListener('DOMContentLoaded', () => {
    currentUser = getCurrentUser();
    if (!currentUser) {
        window.location.href = 'login.html';
        return;
    }
    initSocket();
});

function initSocket() {
    const token = getToken();
    socket = io({ auth: { token: token } });

    socket.on('connect', () => {
        const status = document.getElementById('connectionStatus');
        status.className = 'text-xs font-bold px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-700';
        status.innerHTML = '🟢 Connecté';
    });

    socket.on('chat:history', (messages) => {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        if (messages.length === 0) {
            container.innerHTML = '<div class="text-center text-xs text-slate-400 py-4">Aucun message. Soyez le premier !</div>';
            return;
        }
        messages.forEach(renderMessage);
        scrollToBottom();
    });

    socket.on('chat:message', (msg) => {
        renderMessage(msg);
        scrollToBottom();
    });

    socket.on('users:list', (users) => {
        document.getElementById('onlineCount').innerText = users.length;
        document.getElementById('onlineUsers').innerHTML = users.map(u => {
            const icons = { super_admin: '👑', moderator: '🔵', model: '🟢', user: '⚪' };
            return '<div class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50">' +
                '<div class="w-6 h-6 rounded-full bg-gradient-to-r from-purple-500 to-brand-primary text-white flex items-center justify-center text-[10px] font-bold">' + u.username[0].toUpperCase() + '</div>' +
                '<span class="font-medium text-slate-700">' + (icons[u.role] || '') + ' ' + u.username + '</span>' +
            '</div>';
        }).join('');
    });

    socket.on('system', (data) => {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'text-center text-xs text-slate-400 py-2 italic';
        div.textContent = '— ' + data.text + ' —';
        container.appendChild(div);
        scrollToBottom();
    });

    socket.on('salon:joined', (data) => {
        document.getElementById('currentSalon').innerText = '💬 ' + data.salon;
        currentSalon = data.salon;
    });

    socket.on('reaction', (data) => {
        showEmojiFloat(data.emoji);
    });

    socket.on('gift', (data) => {
        animateGift(data);
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'message p-3 bg-gradient-to-r ' + (data.color || 'from-pink-50 to-purple-50') + ' rounded-xl text-center';
        div.innerHTML = '<p class="text-sm text-white font-bold drop-shadow"><strong>' + data.username + '</strong> a envoyé <span class="text-2xl mx-1">' + data.gift + '</span><strong>' + (data.giftName || '') + '</strong>' + (data.receiver ? ' à <strong>' + data.receiver + '</strong>' : '') + '</p>' + (data.message ? '<p class="text-xs text-white/90 italic mt-1">"' + escapeHtml(data.message) + '"</p>' : '');
        container.appendChild(div);
        scrollToBottom();
    });

    socket.on('connect_error', (err) => {
        const status = document.getElementById('connectionStatus');
        status.className = 'text-xs font-bold px-3 py-1.5 rounded-full bg-rose-100 text-rose-700';
        status.innerHTML = '❌ ' + err.message;
    });
}

// ---------- CHAT ----------
function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !socket) return;
    socket.emit('chat:message', { text: text, salon: currentSalon });
    input.value = '';
}

function renderMessage(msg) {
    const container = document.getElementById('chatMessages');
    const isMe = currentUser && msg.user_id === currentUser.id;
    const time = new Date(msg.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const icons = { super_admin: '👑', moderator: '🔵', model: '🟢', user: '⚪' };
    const icon = icons[msg.role] || '';
    const div = document.createElement('div');
    div.className = 'message';
    div.innerHTML = '<div class="' + (isMe ? 'flex justify-end' : '') + '">' +
        '<div class="' + (isMe ? 'bg-pink-500 text-white rounded-2xl rounded-tr-sm px-4 py-2 max-w-md' : 'max-w-md') + '">' +
            (!isMe ? '<div class="flex items-center gap-2 mb-0.5"><span class="text-xs font-bold text-slate-700">' + icon + ' ' + msg.username + '</span><span class="text-[10px] text-slate-400">' + time + '</span></div>' : '') +
            '<p class="text-sm ' + (isMe ? '' : 'text-slate-700') + '">' + escapeHtml(msg.text) + '</p>' +
        '</div>' +
    '</div>';
    container.appendChild(div);
}

function joinSalon(salon, btn) {
    if (salon === currentSalon) return;
    document.querySelectorAll('.salon-btn').forEach(b => {
        b.classList.remove('bg-pink-50', 'border', 'border-pink-200/60', 'text-pink-500', 'font-bold');
        b.classList.add('hover:bg-slate-50', 'text-slate-700');
    });
    btn.classList.add('bg-pink-50', 'border', 'border-pink-200/60', 'text-pink-500', 'font-bold');
    btn.classList.remove('hover:bg-slate-50', 'text-slate-700');
    if (socket) socket.emit('salon:join', salon);
}

function sendReaction(emoji) {
    if (socket) socket.emit('reaction', { emoji: emoji });
}

function showEmojiFloat(emoji) {
    const el = document.createElement('div');
    el.className = 'emoji-float';
    el.innerText = emoji;
    el.style.left = (Math.random() * 60 + 20) + '%';
    el.style.bottom = '100px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
}

function scrollToBottom() {
    const c = document.getElementById('chatMessages');
    setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// SYSTÈME DE CADEAUX
// ============================================================
async function openGiftModal() {
    document.getElementById('giftModal').classList.remove('hidden');
    document.getElementById('giftModal').classList.add('flex');
    await loadGifts();
    await loadGiftBalance();
}

function closeGiftModal() {
    document.getElementById('giftModal').classList.add('hidden');
    document.getElementById('giftModal').classList.remove('flex');
    selectedGift = null;
    document.getElementById('giftSendBtn').disabled = true;
    document.getElementById('giftSendBtn').innerText = 'Sélectionnez un cadeau';
}

async function loadGifts() {
    try {
        const data = await apiCall('/credits/gifts');
        gifts = data.gifts;
        renderGifts();
    } catch (err) {
        document.getElementById('giftsGrid').innerHTML = '<p class="text-rose-500 col-span-full text-center">' + err.message + '</p>';
    }
}

async function loadGiftBalance() {
    try {
        const data = await apiCall('/credits/balance');
        userBalance = data.balance;
        document.getElementById('giftBalance').innerText = data.balance;
    } catch (err) {
        console.error(err);
    }
}

function renderGifts() {
    document.getElementById('giftsGrid').innerHTML = gifts.map(g => `
        <button onclick="selectGift(${g.id})" id="gift-${g.id}"
            class="gift-item relative p-3 rounded-2xl border-2 border-slate-200 hover:border-brand-primary bg-white transition-all text-center">
            <div class="text-4xl mb-1">${g.emoji}</div>
            <p class="text-xs font-bold text-slate-800">${g.name}</p>
            <p class="text-[10px] text-pink-500 font-bold mt-0.5">${g.price} crédits</p>
        </button>
    `).join('');
}

function selectGift(giftId) {
    selectedGift = gifts.find(g => g.id === giftId);
    document.querySelectorAll('.gift-item').forEach(el => {
        el.classList.remove('border-brand-primary', 'bg-pink-50', 'ring-2', 'ring-pink-200');
        el.classList.add('border-slate-200');
    });
    const el = document.getElementById('gift-' + giftId);
    el.classList.remove('border-slate-200');
    el.classList.add('border-brand-primary', 'bg-pink-50', 'ring-2', 'ring-pink-200');

    const btn = document.getElementById('giftSendBtn');
    btn.disabled = false;
    btn.innerText = 'Envoyer ' + selectedGift.emoji + ' ' + selectedGift.name + ' (' + selectedGift.price + ' crédits)';
}

async function confirmSendGift() {
    if (!selectedGift) return;
    if (userBalance < selectedGift.price) {
        showToast('❌ Crédits insuffisants. Rechargez votre compte.', 'error');
        return;
    }

    const receiver = document.getElementById('giftReceiver').value.trim();
    const message = document.getElementById('giftMessage').value.trim();

    try {
        const result = await apiCall('/credits/gifts/send', {
            method: 'POST',
            body: JSON.stringify({
                giftId: selectedGift.id,
                receiverUsername: receiver || null,
                salon: currentSalon,
                message: message
            })
        });

        socket.emit('gift', {
            gift: selectedGift.emoji,
            giftName: selectedGift.name,
            color: selectedGift.color,
            receiver: receiver || null,
            message: message
        });

        showToast('🎁 ' + selectedGift.name + ' envoyé !', 'success');
        userBalance = result.newBalance;
        document.getElementById('giftBalance').innerText = userBalance;
        closeGiftModal();
        document.getElementById('giftReceiver').value = '';
        document.getElementById('giftMessage').value = '';
    } catch (err) {
        showToast(err.message, 'error');
    }
}

function animateGift(giftData) {
    const container = document.createElement('div');
    container.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:8rem;z-index:99999;pointer-events:none;transition:all 0.8s cubic-bezier(0.34,1.56,0.64,1);filter:drop-shadow(0 0 30px rgba(233,30,99,0.6));';
    container.innerHTML = '<div style="text-align:center;"><div style="font-size:8rem;animation:gift-bounce 0.6s ease-out;">' + giftData.gift + '</div><div style="font-size:1.2rem;color:white;font-weight:bold;text-shadow:0 2px 10px rgba(0,0,0,0.5);margin-top:-20px;">' + giftData.username + ' → ' + (giftData.giftName || 'Cadeau') + '</div></div>';
    document.body.appendChild(container);
    setTimeout(() => { container.style.transform = 'translate(-50%,-50%) scale(1)'; }, 50);
    setTimeout(() => {
        container.style.transform = 'translate(-50%,-150%) scale(1.5)';
        container.style.opacity = '0';
    }, 1500);
    setTimeout(() => container.remove(), 2500);
}

// ============================================================
// SYSTÈME DE SIGNALEMENT
// ============================================================
function openReportModal() {
    document.getElementById('reportModal').classList.remove('hidden');
    document.getElementById('reportModal').classList.add('flex');
}

function closeReportModal() {
    document.getElementById('reportModal').classList.add('hidden');
    document.getElementById('reportModal').classList.remove('flex');
}

async function submitReport(e) {
    e.preventDefault();
    const targetUsername = document.getElementById('reportTarget').value.trim();
    const reason = document.getElementById('reportReason').value;
    const description = document.getElementById('reportDescription').value.trim();

    try {
        await apiCall('/reports', {
            method: 'POST',
            body: JSON.stringify({
                targetType: 'user',
                targetUsername: targetUsername,
                reason: reason,
                description: description
            })
        });
        showToast('✅ Signalement envoyé. Merci !', 'success');
        closeReportModal();
        document.getElementById('reportTarget').value = '';
        document.getElementById('reportReason').value = '';
        document.getElementById('reportDescription').value = '';
    } catch (err) {
        showToast(err.message, 'error');
    }
}
</script>

</body>
</html>
