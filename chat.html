<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en direct — E-VISIOCAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://e-visiocam-api.onrender.com/socket.io/socket.io.js"></script>
    <script src="auth-api.js"></script>
    <script src="nav-auth.js" defer></script>
    <script src="legal-banner.js"></script>
    <style>
        .live-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .message { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emoji-float {
            position: fixed;
            font-size: 2rem;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-200px) scale(1.5); }
        }
        @keyframes gift-bounce {
            0% { transform: scale(0.5) rotate(-10deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .camera-tile video {
            transition: opacity 0.3s;
        }
        .camera-tile.cam-off video {
            opacity: 0.1;
        }
    </style>

    <link rel="stylesheet" href="style.css?v=20261001-2">
</head>
<body class="h-full text-slate-800 flex flex-col font-sans bg-slate-100">

<script>
(function() {
    if (typeof isLoggedIn !== 'function' || !isLoggedIn()) {
        // On conserve le salon demandé pour y revenir après connexion
        window.location.href = 'login.html?redirect=' + encodeURIComponent('chat.html' + window.location.search);
        return;
    }
})();
</script>

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <!-- Même grille que l'accueil : logo dans la colonne de 256px -->
    <div class="max-w-[1700px] mx-auto px-3 md:px-6 h-16 flex items-center gap-6">
        <div class="flex items-center lg:w-64 lg:shrink-0">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-purple-600 flex items-center justify-center text-white">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <span class="text-2xl font-black text-slate-900">Chat <span class="text-brand-primary">Live</span></span>
            </a>
        </div>
        <div class="ml-auto flex items-center gap-3">
            <a href="salons.html" class="text-sm text-slate-600 hover:text-brand-primary font-semibold">
                <i class="fa-solid fa-arrow-left mr-1"></i> Salons
            </a>
            <div id="connectionStatus" class="text-xs font-bold px-3 py-1.5 rounded-full bg-amber-100 text-amber-700">
                ⚡ Connexion...
            </div>
            <div id="navAuth" class="flex items-center gap-2"></div>
        </div>
    </div>
</header>

<main class="max-w-[1700px] w-full mx-auto flex-1 p-4 flex flex-col lg:flex-row gap-4 overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="hidden lg:flex flex-col w-56 shrink-0 gap-4">
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm">
            <h3 class="font-bold text-slate-900 text-sm mb-3">💬 Salons</h3>
            <div class="space-y-1 text-xs font-medium">
                <button data-salon="Salon Général" onclick="joinSalon('Salon Général', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl bg-pink-50 border border-pink-200/60 text-brand-primary font-bold">
                    🌍 Salon Général
                </button>
                <button data-salon="Salon Français" onclick="joinSalon('Salon Français', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    🇫🇷 Salon Français
                </button>
                <button data-salon="Salon International" onclick="joinSalon('Salon International', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    🌐 Salon International
                </button>
                <button data-salon="Salon Couples" onclick="joinSalon('Salon Couples', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    💕 Salon Couples
                </button>
                <button data-salon="Salon Amateurs" onclick="joinSalon('Salon Amateurs', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    ✨ Salon Amateurs
                </button>
                <button data-salon="Salon Musique" onclick="joinSalon('Salon Musique', this)" class="salon-btn w-full text-left px-3 py-2 rounded-xl hover:bg-slate-50 text-slate-700">
                    🎵 Salon Musique

        </div>

        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex-1 overflow-hidden flex flex-col">

            </div>

                <p class="text-slate-400 text-center py-4">Chargement...</p>

    <!-- ZONE PRINCIPALE -->

        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">

                </h3>
                <div class="flex items-center gap-2">
                    <button onclick="toggleCameraView()" class="text-xs text-slate-400 hover:text-slate-700" title="Réduire/agrandir">
                        <i class="fa-solid fa-eye" id="cameraViewIcon"></i>
                    </button>
                </div>
            </div>
            <div id="camerasGrid" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-h-[240px] overflow-y-auto">
                <p class="text-slate-400 text-center py-6 text-xs col-span-full">
                    <i class="fa-solid fa-video-slash mr-1"></i> Aucune caméra active dans ce salon

        <!-- CHAT + LISTE -->
        <div class="flex-1 flex flex-col lg:flex-row gap-4 overflow-hidden">

            <!-- CHAT -->
            <div class="flex-1 flex flex-col bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden min-h-[400px]">
                <div class="px-4 py-2 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <div>
                        <h2 class="font-bold text-slate-900 text-sm" id="currentSalon">🌍 Salon Général</h2>
                        <p class="text-xs text-slate-500">Chat en temps réel</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="sendReaction('❤️')" class="w-8 h-8 rounded-full bg-rose-50 hover:bg-rose-100 flex items-center justify-center text-sm" title="J'aime">❤️</button>
                        <button onclick="sendReaction('👏')" class="w-8 h-8 rounded-full bg-amber-50 hover:bg-amber-100 flex items-center justify-center text-sm" title="Bravo">👏</button>

                        <button onclick="openReportModal()" class="w-8 h-8 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-500 flex items-center justify-center text-sm" title="Signaler">

                </div>

                <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/30">
                    <div class="text-center text-xs text-slate-400 py-4">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Chargement...
                    </div>
                </div>

                <form id="chatForm" onsubmit="sendMessage(event)" class="p-3 border-t border-slate-100 flex items-center gap-2 bg-white">
                    <input type="text" id="chatInput" placeholder="Écrire un message..." maxlength="500" autocomplete="off"

                    <button type="submit" class="w-11 h-11 rounded-full bg-brand-primary hover:bg-brand-hover text-white flex items-center justify-center shrink-0 active:scale-95 shadow-md">
                        <i class="fa-solid fa-paper-plane"></i>

            </div>

</main>

<!-- MODAL CADEAUX -->

                <select id="reportReason" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-brand-primary focus:outline-none">
                    <option value="">-- Choisir --</option>
                    <option value="contenu_illegal">🚨 Contenu illégal</option>
                    <option value="mineur">⚠️ Mineur présent</option>
                    <option value="violence">⚔️ Violence</option>
                    <option value="harcelement">😠 Harcèlement</option>
                    <option value="contenu_sexuel_non_consenti">🚫 Contenu non consenti</option>
                    <option value="spam">📢 Spam</option>
                    <option value="comportement">😤 Comportement inapproprié</option>
                    <option value="autre">❓ Autre</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Description (optionnel)</label>
                <textarea id="reportDescription" rows="3" maxlength="500" placeholder="Décrivez..."

            </div>

<script>
// ============================================================
// VARIABLES
// ============================================================
let socket = null;
// Salon demandé dans l'URL (bouton "Rejoindre" de salons.html) : chat.html?salon=Salon%20Fran%C3%A7ais
const salonFromUrl = (new URLSearchParams(window.location.search).get('salon') || '').trim();
let currentSalon = salonFromUrl || 'Salon Général';
let currentUser = null;
let gifts = [];
let selectedGift = null;
let userBalance = 0;
let salonStreams = [];
let viewerPeerConnections = {};
let cameraViewExpanded = true;
let remoteAudioStates = {};

const rtcConfig = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
};

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    currentUser = getCurrentUser();
    if (!currentUser) { window.location.href = 'login.html'; return; }
    // On affiche tout de suite le salon demandé (avant même la connexion au socket)
    const titleEl = document.getElementById('currentSalon');
    if (titleEl) titleEl.innerText = '💬 ' + currentSalon;
    highlightSalonButton(currentSalon);
    initSocket();
});

// ============================================================
// SOCKET
// ============================================================
function initSocket() {
    socket = io('https://e-visiocam-api.onrender.com', { 
    auth: { token: getToken() } 
});

    socket.on('connect', () => {
        const status = document.getElementById('connectionStatus');
        status.className = 'text-xs font-bold px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-700';
        status.innerHTML = '🟢 Connecté';

        socket.emit('salon:join', currentSalon);
        refreshSalonStreams();
    });

    socket.on('connect_error', (err) => {
        const status = document.getElementById('connectionStatus');
        status.className = 'text-xs font-bold px-3 py-1.5 rounded-full bg-rose-100 text-rose-700';
        status.innerHTML = '❌ ' + err.message;
    });

    // Messages
    socket.on('chat:history', (messages) => {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        if (messages.length === 0) {
            container.innerHTML = '<div class="text-center text-xs text-slate-400 py-4">Aucun message. Soyez le premier !</div>';
            return;
        }
        messages.forEach(renderMessage);
        scrollToBottom();
    });

    socket.on('chat:message', (msg) => {
        renderMessage(msg);
        scrollToBottom();
    });

    // Utilisateurs en ligne
    socket.on('users:list', (users) => {
        document.getElementById('onlineCount').innerText = users.length;
        document.getElementById('onlineUsers').innerHTML = users.map(u => {
            const icons = { super_admin: '👑', moderator: '🔵', model: '🟢', user: '⚪' };
            const liveIcon = u.streamId ? ' 🔴' : '';
            return '<div class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50">' +
                '<div class="w-6 h-6 rounded-full bg-gradient-to-r from-purple-500 to-brand-primary text-white flex items-center justify-center text-[10px] font-bold">' + u.username[0].toUpperCase() + '</div>' +
                '<span class="font-medium text-slate-700">' + (icons[u.role] || '') + ' ' + u.username + liveIcon + '</span>' +
            '</div>';
        }).join('');
    });

    socket.on('system', (data) => {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'text-center text-xs text-slate-400 py-2 italic';
        div.textContent = '— ' + data.text + ' —';
        container.appendChild(div);
        scrollToBottom();
    });

    socket.on('salon:joined', (data) => {
        document.getElementById('currentSalon').innerText = '💬 ' + data.salon;
        currentSalon = data.salon;
    });

    // ============================================================
    // CAMÉRAS DU SALON
    // ============================================================
    socket.on('salon:streams-list', (data) => {
        salonStreams = data.streams || [];
        renderSalonCameras();
    });

    socket.on('salon:stream-started', () => {
        setTimeout(refreshSalonStreams, 300);
    });

    socket.on('salon:stream-stopped', (data) => {
        if (viewerPeerConnections[data.streamId]) {
            viewerPeerConnections[data.streamId].close();
            delete viewerPeerConnections[data.streamId];
        }
        setTimeout(refreshSalonStreams, 300);
    });

    socket.on('salon:stream-updated', () => {
        setTimeout(refreshSalonStreams, 300);
    });

    // WebRTC Viewer
    socket.on('webrtc:answer', async (data) => {
        if (viewerPeerConnections[data.streamId]) {
            try {
                await viewerPeerConnections[data.streamId].setRemoteDescription(
                    new RTCSessionDescription(data.answer)
                );
            } catch (err) { console.error('WebRTC:', err); }
        }
    });

    socket.on('webrtc:ice-candidate', async (data) => {
        for (const [streamId, pc] of Object.entries(viewerPeerConnections)) {
            if (pc && data.candidate) {
                try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (err) {}
            }
        }
    });

    // Réactions
    socket.on('reaction', (data) => { showEmojiFloat(data.emoji); });

    // Cadeaux
    socket.on('gift', (data) => {
        animateGift(data);
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'message p-3 bg-gradient-to-r ' + (data.color || 'from-pink-50 to-purple-50') + ' rounded-xl text-center';
        div.innerHTML = '<p class="text-sm text-white font-bold drop-shadow"><strong>' + data.username + '</strong> a envoyé <span class="text-2xl mx-1">' + data.gift + '</span><strong>' + (data.giftName || '') + '</strong>' + (data.receiver ? ' à <strong>' + data.receiver + '</strong>' : '') + '</p>';
        container.appendChild(div);
        scrollToBottom();
    });
}

// ============================================================
// CAMÉRAS DU SALON
// ============================================================
function refreshSalonStreams() {
    if (socket) socket.emit('salon:request-streams');
}

function renderSalonCameras() {
    const grid = document.getElementById('camerasGrid');
    const count = document.getElementById('cameraCount');
    const myId = currentUser ? currentUser.id : 0;

    if (!salonStreams || salonStreams.length === 0) {
        count.textContent = '0';
        grid.innerHTML = '<p class="text-slate-400 text-center py-6 text-xs col-span-full"><i class="fa-solid fa-video-slash mr-1"></i> Aucune caméra active dans ce salon</p>';
        return;
    }

    count.textContent = salonStreams.length;

    grid.innerHTML = salonStreams.map(s => {
        const isMe = s.broadcasterId === myId;
        const isMuted = remoteAudioStates[s.streamId] !== false;

        return `
            <div class="camera-tile relative bg-slate-900 rounded-xl overflow-hidden aspect-video ${s.isCameraOff ? 'cam-off' : ''}" data-stream-id="${s.streamId}">
                <video id="cam-${s.streamId}" autoplay playsinline muted class="w-full h-full object-cover"></video>

                ${s.isCameraOff ? `
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-white bg-slate-900/90">
                        <i class="fa-solid fa-video-slash text-2xl mb-1"></i>
                        <p class="text-[10px]">Cam masquée</p>
                    </div>
                ` : ''}

                <!-- LIVE badge -->
                <div class="absolute top-1.5 left-1.5 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1">
                    <span class="w-1 h-1 bg-white rounded-full live-pulse"></span> LIVE
                </div>

                <!-- Son button -->
                ${!isMe ? `
                    <button onclick="toggleCameraAudio('${s.streamId}'); event.stopPropagation();"
                        class="absolute top-1.5 right-1.5 w-6 h-6 rounded bg-black/60 hover:bg-black/80 backdrop-blur text-white text-[10px] flex items-center justify-center"
                        title="Son">
                        <i class="fa-solid ${isMuted ? 'fa-volume-xmark' : 'fa-volume-high'}" id="vol-icon-${s.streamId}"></i>
                    </button>
                ` : ''}

                <!-- Infos bas -->
                <div class="absolute bottom-0 left-0 right-0 p-1.5 bg-gradient-to-t from-black/90 to-transparent">
                    <p class="text-white text-[10px] font-bold truncate">
                        ${s.broadcasterUsername}${isMe ? ' (moi)' : ''}
                    </p>
                    <p class="text-white/70 text-[9px]">${s.viewers} 👁️</p>
                </div>

                <!-- Micro coupé -->
                ${s.isMicMuted ? `
                    <div class="absolute bottom-1.5 right-1.5 bg-orange-500 text-white text-[9px] p-1 rounded">
                        <i class="fa-solid fa-microphone-slash"></i>
                    </div>
                ` : ''}
            </div>
        `;
    }).join('');

    // Démarrer WebRTC pour chaque stream (sauf le mien)
    salonStreams.forEach(s => {
        if (s.broadcasterId !== myId && !viewerPeerConnections[s.streamId]) {
            startViewingStream(s.streamId);
        }
    });
}

async function startViewingStream(streamId) {
    const stream = salonStreams.find(s => s.streamId === streamId);
    if (!stream) return;

    try {
        const pc = new RTCPeerConnection(rtcConfig);
        viewerPeerConnections[streamId] = pc;

        pc.ontrack = (event) => {
            const videoEl = document.getElementById('cam-' + streamId);
            if (videoEl) {
                videoEl.srcObject = event.streams[0];
                videoEl.play().catch(e => {});
            }
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('webrtc:ice-candidate', {
                    candidate: event.candidate,
                    streamId: streamId
                });
            }
        };

        const offer = await pc.createOffer({
            offerToReceiveVideo: true,
            offerToReceiveAudio: true
        });
        await pc.setLocalDescription(offer);
        socket.emit('webrtc:offer', { offer: offer, streamId: streamId });
    } catch (err) {
        console.error('Erreur WebRTC:', err);
    }
}

function toggleCameraAudio(streamId) {
    const videoEl = document.getElementById('cam-' + streamId);
    const iconEl = document.getElementById('vol-icon-' + streamId);
    if (!videoEl) return;

    const currentMuted = remoteAudioStates[streamId] !== false;
    remoteAudioStates[streamId] = !currentMuted;
    videoEl.muted = !currentMuted;

    if (iconEl) {
        iconEl.className = !currentMuted
            ? 'fa-solid fa-volume-xmark'
            : 'fa-solid fa-volume-high';
    }
}

function toggleCameraView() {
    cameraViewExpanded = !cameraViewExpanded;
    const grid = document.getElementById('camerasGrid');
    const icon = document.getElementById('cameraViewIcon');
    if (cameraViewExpanded) {
        grid.classList.remove('hidden');
        icon.className = 'fa-solid fa-eye';
    } else {
        grid.classList.add('hidden');
        icon.className = 'fa-solid fa-eye-slash';
    }
}

// ============================================================
// CHAT
// ============================================================
function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !socket) return;
    socket.emit('chat:message', { text: text, salon: currentSalon });
    input.value = '';
}

function renderMessage(msg) {
    const container = document.getElementById('chatMessages');
    const isMe = currentUser && msg.user_id === currentUser.id;
    const time = new Date(msg.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const icons = { super_admin: '👑', moderator: '🔵', model: '🟢', user: '⚪' };
    const icon = icons[msg.role] || '';
    const div = document.createElement('div');
    div.className = 'message';
    div.innerHTML = '<div class="' + (isMe ? 'flex justify-end' : '') + '">' +
        '<div class="' + (isMe ? 'bg-brand-primary text-white rounded-2xl rounded-tr-sm px-4 py-2 max-w-md' : 'max-w-md') + '">' +
            (!isMe ? '<div class="flex items-center gap-2 mb-0.5"><span class="text-xs font-bold text-slate-700">' + icon + ' ' + msg.username + '</span><span class="text-[10px] text-slate-400">' + time + '</span></div>' : '') +
            '<p class="text-sm ' + (isMe ? '' : 'text-slate-700') + '">' + escapeHtml(msg.text) + '</p>' +
        '</div>' +
    '</div>';
    container.appendChild(div);
}

// Met en évidence le salon actif dans la liste de gauche
function highlightSalonButton(salon) {
    document.querySelectorAll('.salon-btn').forEach(b => {
        const actif = b.dataset.salon === salon;
        b.classList.toggle('bg-pink-50', actif);
        b.classList.toggle('border', actif);
        b.classList.toggle('border-pink-200/60', actif);
        b.classList.toggle('text-brand-primary', actif);
        b.classList.toggle('font-bold', actif);
        b.classList.toggle('hover:bg-slate-50', !actif);
        b.classList.toggle('text-slate-700', !actif);
    });
}

function joinSalon(salon, btn) {
    highlightSalonButton(salon);
    if (salon === currentSalon) return;
    currentSalon = salon;

    // Le salon reste dans l'URL : un rafraîchissement ou un partage le conserve
    if (window.history && window.history.replaceState) {
        const url = new URL(window.location.href);
        url.searchParams.set('salon', salon);
        window.history.replaceState({}, '', url);
    }
    const titleEl = document.getElementById('currentSalon');
    if (titleEl) titleEl.innerText = '💬 ' + salon;

    // Fermer les streams de l'ancien salon
    Object.keys(viewerPeerConnections).forEach(streamId => {
        viewerPeerConnections[streamId].close();
        delete viewerPeerConnections[streamId];
    });
    salonStreams = [];
    renderSalonCameras();

    if (socket) socket.emit('salon:join', salon);
}

function sendReaction(emoji) {
    if (socket) socket.emit('reaction', { emoji: emoji });
}

function showEmojiFloat(emoji) {
    const el = document.createElement('div');
    el.className = 'emoji-float';
    el.innerText = emoji;
    el.style.left = (Math.random() * 60 + 20) + '%';
    el.style.bottom = '100px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
}

function scrollToBottom() {
    const c = document.getElementById('chatMessages');
    setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// CADEAUX
// ============================================================
async function openGiftModal() {
    document.getElementById('giftModal').classList.remove('hidden');
    document.getElementById('giftModal').classList.add('flex');
    await loadGifts();
    await loadGiftBalance();
}

function closeGiftModal() {
    document.getElementById('giftModal').classList.add('hidden');
    document.getElementById('giftModal').classList.remove('flex');
    selectedGift = null;
    document.getElementById('giftSendBtn').disabled = true;
    document.getElementById('giftSendBtn').innerText = 'Sélectionnez un cadeau';
}

async function loadGifts() {
    try {
        const data = await apiCall('/credits/gifts');
        gifts = data.gifts;
        renderGifts();
    } catch (err) {
        document.getElementById('giftsGrid').innerHTML = '<p class="text-rose-500 col-span-full text-center">' + err.message + '</p>';
    }
}

async function loadGiftBalance() {
    try {
        const data = await apiCall('/credits/balance');
        userBalance = data.balance;
        document.getElementById('giftBalance').innerText = data.balance;
    } catch (err) {}
}

function renderGifts() {
    document.getElementById('giftsGrid').innerHTML = gifts.map(g => `
        <button onclick="selectGift(${g.id})" id="gift-${g.id}"
            class="gift-item relative p-3 rounded-2xl border-2 border-slate-200 hover:border-brand-primary bg-white transition-all text-center">
            <div class="text-3xl mb-1">${g.emoji}</div>
            <p class="text-xs font-bold text-slate-800">${g.name}</p>
            <p class="text-[10px] text-brand-primary font-bold mt-0.5">${g.price} crédits</p>
        </button>
    `).join('');
}

function selectGift(giftId) {
    selectedGift = gifts.find(g => g.id === giftId);
    document.querySelectorAll('.gift-item').forEach(el => {
        el.classList.remove('border-brand-primary', 'bg-pink-50', 'ring-2', 'ring-pink-200');
        el.classList.add('border-slate-200');
    });
    const el = document.getElementById('gift-' + giftId);
    el.classList.remove('border-slate-200');
    el.classList.add('border-brand-primary', 'bg-pink-50', 'ring-2', 'ring-pink-200');

    const btn = document.getElementById('giftSendBtn');
    btn.disabled = false;
    btn.innerText = 'Envoyer ' + selectedGift.emoji + ' ' + selectedGift.name + ' (' + selectedGift.price + ' crédits)';
}

async function confirmSendGift() {
    if (!selectedGift) return;
    if (userBalance < selectedGift.price) {
        showToast('❌ Crédits insuffisants', 'error');
        return;
    }

    const receiver = document.getElementById('giftReceiver').value.trim();
    const message = document.getElementById('giftMessage').value.trim();

    try {
        const result = await apiCall('/credits/gifts/send', {
            method: 'POST',
            body: JSON.stringify({
                giftId: selectedGift.id,
                receiverUsername: receiver || null,
                salon: currentSalon,
                message: message
            })
        });

        socket.emit('gift', {
            gift: selectedGift.emoji,
            giftName: selectedGift.name,
            color: selectedGift.color,
            receiver: receiver || null,
            message: message
        });

        showToast('🎁 ' + selectedGift.name + ' envoyé !', 'success');
        userBalance = result.newBalance;
        document.getElementById('giftBalance').innerText = userBalance;
        closeGiftModal();
        document.getElementById('giftReceiver').value = '';
        document.getElementById('giftMessage').value = '';
    } catch (err) {
        showToast(err.message, 'error');
    }
}

function animateGift(giftData) {
    const container = document.createElement('div');
    container.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:8rem;z-index:99999;pointer-events:none;transition:all 0.8s cubic-bezier(0.34,1.56,0.64,1);filter:drop-shadow(0 0 30px rgba(233,30,99,0.6));';
    container.innerHTML = '<div style="text-align:center;"><div style="font-size:8rem;animation:gift-bounce 0.6s ease-out;">' + giftData.gift + '</div><div style="font-size:1.2rem;color:white;font-weight:bold;text-shadow:0 2px 10px rgba(0,0,0,0.5);margin-top:-20px;">' + giftData.username + ' → ' + (giftData.giftName || 'Cadeau') + '</div></div>';
    document.body.appendChild(container);
    setTimeout(() => { container.style.transform = 'translate(-50%,-50%) scale(1)'; }, 50);
    setTimeout(() => {
        container.style.transform = 'translate(-50%,-150%) scale(1.5)';
        container.style.opacity = '0';
    }, 1500);
    setTimeout(() => container.remove(), 2500);
}

// ============================================================
// SIGNALEMENT
// ============================================================
function openReportModal() {
    document.getElementById('reportModal').classList.remove('hidden');
    document.getElementById('reportModal').classList.add('flex');
}

function closeReportModal() {
    document.getElementById('reportModal').classList.add('hidden');
    document.getElementById('reportModal').classList.remove('flex');
}

async function submitReport(e) {
    e.preventDefault();
    const targetUsername = document.getElementById('reportTarget').value.trim();
    const reason = document.getElementById('reportReason').value;
    const description = document.getElementById('reportDescription').value.trim();

    try {
        await apiCall('/reports', {
            method: 'POST',
            body: JSON.stringify({
                targetType: 'user',
                targetUsername: targetUsername,
                reason: reason,
                description: description
            })
        });
        showToast('✅ Signalement envoyé', 'success');
        closeReportModal();
        document.getElementById('reportTarget').value = '';
        document.getElementById('reportReason').value = '';
        document.getElementById('reportDescription').value = '';
    } catch (err) {
        showToast(err.message, 'error');
    }
}
</script>
